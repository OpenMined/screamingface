# Scope Dependabot to the maintained apps only, with grouped updates.
#
# Without this file Dependabot auto-discovers EVERY manifest in the repo.
# Listing explicit directories means only these trees are scanned; `groups`
# collapses each ecosystem's bumps into a single PR.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/apps/aigateway"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      aigateway-python:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/apps/scoreboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      scoreboard-python:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/packages/url4"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      url4-python:
        patterns: ["*"]

  # WHY `backend` and not `/apps/url4-cloud`: the aggregate there is `package = false` and holds
  # no runtime constraints — the real ones live in backend/pyproject.toml, which Dependabot would
  # otherwise never bump.
  - package-ecosystem: "uv"
    directory: "/apps/url4-cloud/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      url4-cloud-python:
        patterns: ["*"]

  # The runtime image's base layers drift silently otherwise — they are pinned by tag, and
  # nothing else in CI notices a new patch release of the base.
  - package-ecosystem: "docker"
    directory: "/apps/url4-cloud/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  # Keep GitHub Actions pinned-version bumps current too (low volume).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
