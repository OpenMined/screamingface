name: Probe GitHub Pages static artifact

on:
  push:
    branches:
      - pages-static-artifact-probe
  # Also keep manual dispatch for later cleanup once this workflow exists on main.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/configure-pages@v6

      - name: Stage website, portal, and allowlisted artifact
        env:
          SCOREBOARD_API_BASE: ${{ vars.SCOREBOARD_API_BASE || 'https://scoreboard.screamingface.ai' }}
        run: |
          set -euo pipefail
          stage_dir="/tmp/sf-pages-probe"
          artifact_files=(
            "output_artifacts/eval_results/livetruth-latest.eval.jsonl"
            "output_artifacts/eval_results/livetruth-masking.dataset.jsonl"
          )

          for source_file in "${artifact_files[@]}"; do
            test -f "$source_file"
          done
          test -f web/public/index.html
          test -f web/portal/index.html
          rm -rf "$stage_dir"
          mkdir -p "$stage_dir/portal"
          cp -R web/public/. "$stage_dir/"
          cp -R web/portal/. "$stage_dir/portal/"
          for source_file in "${artifact_files[@]}"; do
            cp "$source_file" "$stage_dir/$(basename "$source_file")"
          done

          STAGE_DIR="$stage_dir" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          api_base = os.environ["SCOREBOARD_API_BASE"].rstrip("/")
          snippet = f"<script>window.SCOREBOARD_API_BASE = {json.dumps(api_base)};</script>"
          marker = '<script src="main.js" defer></script>'

          portal_dir = Path(os.environ["STAGE_DIR"]) / "portal"
          for name in ("index.html", "benchmark.html", "spec.html"):
              path = portal_dir / name
              text = path.read_text()
              if snippet in text:
                  continue
              if marker not in text:
                  raise SystemExit(f"missing main.js marker in {path}")
              path.write_text(text.replace(marker, f"{snippet}\n  {marker}", 1))
          PY

          test -f "$stage_dir/index.html"
          test -f "$stage_dir/portal/index.html"
          test -f "$stage_dir/livetruth-latest.eval.jsonl"
          test -f "$stage_dir/livetruth-masking.dataset.jsonl"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/sf-pages-probe

      - uses: actions/deploy-pages@v5
        id: deployment
