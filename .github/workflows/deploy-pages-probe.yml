name: Probe GitHub Pages static artifact

on:
  push:
    branches:
      - pages-static-artifact-probe
  # Also keep manual dispatch for later cleanup once this workflow exists on main.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/configure-pages@v6

      - name: Stage website plus allowlisted artifact
        run: |
          set -euo pipefail
          source_file="output_artifacts/eval_results/livetruth-latest.eval.jsonl"
          stage_dir="public-pages"

          test -f "$source_file"
          test -f web/public/index.html
          rm -rf "$stage_dir"
          mkdir -p "$stage_dir"
          cp -R web/public/. "$stage_dir/"
          cp "$source_file" "$stage_dir/livetruth-latest.eval.jsonl"
          test -f "$stage_dir/index.html"
          test -f "$stage_dir/livetruth-latest.eval.jsonl"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-pages

      - uses: actions/deploy-pages@v5
        id: deployment
