name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "web/public/**"
      - "web/portal/**"
      - "output_artifacts/eval_results/livetruth-latest.eval.jsonl"
      - ".github/workflows/deploy-website.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Pages artifact
        env:
          SCOREBOARD_API_BASE: ${{ vars.SCOREBOARD_API_BASE || 'https://scoreboard.screamingface.ai' }}
        run: |
          rm -rf /tmp/sf-pages
          mkdir -p /tmp/sf-pages/portal
          cp -R web/public/. /tmp/sf-pages/
          cp -R web/portal/. /tmp/sf-pages/portal/
          # Published data receipt at the site root: referenced by sf.json
          # URL4 eval specs. Without it the live URL 404s after any deploy.
          # (livetruth-masking.dataset.jsonl deliberately not published yet.)
          cp output_artifacts/eval_results/livetruth-latest.eval.jsonl /tmp/sf-pages/
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          api_base = os.environ["SCOREBOARD_API_BASE"].rstrip("/")
          snippet = f"<script>window.SCOREBOARD_API_BASE = {json.dumps(api_base)};</script>"
          marker = '<script src="main.js" defer></script>'

          portal_dir = Path("/tmp/sf-pages/portal")
          for name in ("index.html", "benchmark.html", "spec.html"):
              path = portal_dir / name
              text = path.read_text()
              if snippet in text:
                  continue
              if marker not in text:
                  raise SystemExit(f"missing main.js marker in {path}")
              path.write_text(text.replace(marker, f"{snippet}\n  {marker}", 1))
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/sf-pages

      - uses: actions/deploy-pages@v4
        id: deployment
