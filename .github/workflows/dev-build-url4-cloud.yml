# Dev image on every merge to main (path-filtered): immutable main-<shortsha> tags
# so a dev environment can track main automatically. Release builds are untouched
# — this never tags 'latest' and never publishes charts. Single-arch (amd64) for
# speed; dev clusters are amd64.
name: Dev build url4-cloud
on:
  push:
    branches: [main]
    paths:
      - "apps/url4-cloud/**"
      - "packages/url4/**"
      - ".github/workflows/dev-build-url4-cloud.yml"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write # OIDC → Azure; no stored credentials
concurrency:
  group: dev-build-url4-cloud-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      short: ${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v7
      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Platform registry (ACR) — the dev cluster pulls from here. OIDC only:
      # sp-screamingface-ci is federated to this repo's main branch and holds
      # AcrPush on acropenmined and nothing else. No secrets are stored here;
      # the three vars below are non-secret identifiers.
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name acropenmined
      - uses: docker/build-push-action@v7
        with:
          # Context is the repo root — matches the release workflows (url4-cloud's
          # Dockerfile COPYs packages/url4 from outside its own directory).
          context: .
          file: apps/url4-cloud/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/openmined/screamingface-url4-cloud:main-${{ steps.sha.outputs.short }}
            acropenmined.azurecr.io/screamingface-url4-cloud:main-${{ steps.sha.outputs.short }}
            acropenmined.azurecr.io/screamingface-url4-cloud:main-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=dev-url4-cloud
          cache-to: type=gha,scope=dev-url4-cloud,mode=max

  # The BENCHMARK image: the engine above plus DRACO's prepared assets.
  # A Runner Job runs this instead of the App image when
  # `runner.image.repository` points at it; the control plane never does, so a rubric never lands
  # on the pod that terminates client connections.
  #
  # WHY a second job rather than a second `docker/build-push-action` step in the first: it must
  # not run unless the base actually PUBLISHED. `needs:` gives that ordering, and `BASE` is the
  # exact digest-bearing tag the previous job pushed — never a floating tag, so the pair can never
  # drift apart mid-rollout.
  benchmark-image:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/url4-cloud/Dockerfile.benchmark
          platforms: linux/amd64
          push: true
          # AIDEV-NOTE: this build DOWNLOADS the dataset from HuggingFace (`prepare.py` calls
          # `load_dataset`), so it needs egress and is slower than the base build. It carries the
          # WHOLE dataset by design — the truncating build arg was removed 2026-08-02 so a partial
          # image can never be mistaken for a full one.
          build-args: |
            BASE=ghcr.io/openmined/screamingface-url4-cloud:main-${{ needs.image.outputs.short }}
          tags: ghcr.io/openmined/screamingface-url4-cloud-benchmark:main-${{ needs.image.outputs.short }}
          cache-from: type=gha,scope=dev-url4-cloud-benchmark
          cache-to: type=gha,scope=dev-url4-cloud-benchmark,mode=max
