name: Release Desktop

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. desktop-v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#desktop-v}"
          MANIFEST=$(jq -r .version apps/desktop/package.json)
          if [ "$MANIFEST" != "$VERSION" ]; then
            echo "::error::tag $TAG implies version $VERSION but apps/desktop/package.json reports $MANIFEST"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            os: darwin
            arch: arm64
          - runner: macos-14
            os: darwin
            arch: x64
          - runner: ubuntu-latest
            os: linux
            arch: x64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Download build assets
        env:
          BUILD_OS: ${{ matrix.os == 'darwin' && 'mac' || matrix.os }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: ./scripts/download-build-assets.sh --os "$BUILD_OS" --arch "$BUILD_ARCH"

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Electron app
        working-directory: apps/desktop
        run: npm run build

      - name: Package Electron app
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EB_PLATFORM: ${{ matrix.os == 'darwin' && 'mac' || 'linux' }}
          EB_ARCH: ${{ matrix.arch }}
        run: npx electron-builder --"$EB_PLATFORM" --"$EB_ARCH" --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: ScreamingFace Desktop ${{ needs.verify.outputs.version }}
          draft: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to sf-installer (public)
        env:
          GH_TOKEN: ${{ secrets.SF_INSTALLER_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release delete "$TAG" --repo OpenMined/sf-installer --yes 2>/dev/null || true
          gh release create "$TAG" \
            --repo OpenMined/sf-installer \
            --title "ScreamingFace Desktop $VERSION" \
            --notes "Desktop app build for ScreamingFace $VERSION." \
            artifacts/*
