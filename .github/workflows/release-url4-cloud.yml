name: Release url4-cloud

on:
  push:
    tags: ["url4-cloud-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. url4-cloud-v0.1.0)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#url4-cloud-v}"
          # One shipped distribution now (the control plane and the run mode were merged into a
          # single artifact), so there is exactly one version to agree with the tag, and one
          # pyproject.toml holding it.
          DECLARED=$(awk -F'"' '/^version[[:space:]]*=/{print $2; exit}' apps/url4-cloud/pyproject.toml)
          if [ "$DECLARED" != "$VERSION" ]; then
            echo "::error::tag $TAG implies version $VERSION but apps/url4-cloud/pyproject.toml reports $DECLARED"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ONE image, entered in either of two modes (`url4-cloud serve` / `url4-cloud run`). The
  # Dockerfile uses the REPO ROOT as context: it COPYs packages/url4, which carries both the wire
  # contract (`url4.streaming`) the control plane needs and the engine (`url4.dag`) the run mode
  # needs.
  image:
    needs: verify
    runs-on: ubuntu-latest
    env:
      REPO: ghcr.io/openmined/screamingface-url4-cloud
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # Context is the REPO ROOT, not the app dir — the Dockerfile COPYs a path dependency
          # (packages/url4) that lives outside its own directory, matching docker-compose.yml.
          context: .
          file: apps/url4-cloud/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REPO }}:${{ needs.verify.outputs.version }}
            ${{ env.REPO }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  # The BENCHMARK image: the engine above plus every registered Benchmark's prepared assets.
  # A Runner Job runs this when
  # `runner.image.repository` names it; the control plane never does, so a rubric never lands on
  # the pod that terminates client connections.
  #
  # WHY a separate job rather than another step in `image`: it must not run unless the base
  # actually published, and `BASE` must be the exact VERSIONED tag that job pushed — never
  # `latest`, or a release could layer a dataset onto whichever engine happened to be current.
  # That pairing is what lets a published score name the engine it was produced by.
  benchmark-image:
    needs: [verify, image]
    runs-on: ubuntu-latest
    env:
      REPO: ghcr.io/openmined/screamingface-url4-cloud-benchmark
      BASE: ghcr.io/openmined/screamingface-url4-cloud
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/url4-cloud/Dockerfile.benchmark
          # AIDEV-NOTE: this build DOWNLOADS the dataset from HuggingFace (`prepare.py` calls
          # `load_dataset`), so unlike every other job here it needs egress to a third party and
          # can fail for reasons outside this repo. It also carries the WHOLE dataset by design —
          # the truncating build arg was removed 2026-08-02 so a partial image can never be
          # mistaken for a full one. Measured cost of that choice: 2.1 MB on a 369 MB image.
          #
          # Multi-arch matches the base: `runner.image.tag` defaults to the App image's resolved
          # tag, so a narrower benchmark image would break exactly the arm64 clusters the base
          # supports. The arm64 leg runs `prepare` under emulation and is the slow half.
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE=${{ env.BASE }}:${{ needs.verify.outputs.version }}
          tags: ${{ env.REPO }}:${{ needs.verify.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  chart:
    # NOTE: the chart is linted but not published to OCI yet. Follow-up: OME-567.
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Helm
        uses: azure/setup-helm@v5
      - name: Lint chart
        run: helm lint apps/url4-cloud/deploy/helm

  release:
    needs: [verify, image, benchmark-image, chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: ScreamingFace url4-cloud ${{ needs.verify.outputs.version }}
          draft: true
          body: |
            Control-plane image (`url4-cloud serve`):
            ```
            docker pull ghcr.io/openmined/screamingface-url4-cloud:${{ needs.verify.outputs.version }}
            ```

            Benchmark image — the same engine plus the benchmark datasets and private rubrics.
            The chart selects this derived `-benchmark` repository for Runner Jobs by default;
            override `runner.image.repository` only if your mirror uses another name. The control
            plane must keep running the image above, so a rubric never reaches the pod that
            terminates client connections:
            ```
            docker pull ghcr.io/openmined/screamingface-url4-cloud-benchmark:${{ needs.verify.outputs.version }}
            ```

            Helm chart: OCI publish deferred until the NATS dependency is pinned (see OME-567).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
