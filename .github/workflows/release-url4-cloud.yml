name: Release url4-cloud

on:
  push:
    tags: ["url4-cloud-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. url4-cloud-v0.1.0)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#url4-cloud-v}"
          MANIFEST=$(awk -F'"' '/^version[[:space:]]*=/{print $2; exit}' apps/url4-cloud/pyproject.toml)
          if [ "$MANIFEST" != "$VERSION" ]; then
            echo "::error::tag $TAG implies version $VERSION but apps/url4-cloud/pyproject.toml reports $MANIFEST"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # WHY: context is apps/url4-cloud (not repo root) — the Dockerfile COPYs `pyproject.toml`/`src`
      # relative to the app dir, matching docker-compose.yml.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/url4-cloud
          file: apps/url4-cloud/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/openmined/screamingface-url4-cloud:${{ needs.verify.outputs.version }}
            ghcr.io/openmined/screamingface-url4-cloud:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  chart:
    # NOTE: the chart is LINTED only. OCI Helm publishing is DEFERRED until the NATS dependency in
    # apps/url4-cloud/deploy/helm/Chart.yaml is pinned + vendored — it is a placeholder today
    # (Chart.yaml: "confirm before enabling"), so `helm template`/`helm package` fail with
    # "found in Chart.yaml, but missing in charts/ directory: nats". Follow-up: OME-567.
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint apps/url4-cloud/deploy/helm

  release:
    needs: [verify, image, chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: ScreamingFace url4-cloud ${{ needs.verify.outputs.version }}
          draft: true
          body: |
            Container image:
            ```
            docker pull ghcr.io/openmined/screamingface-url4-cloud:${{ needs.verify.outputs.version }}
            ```

            Helm chart: OCI publish deferred until the NATS dependency is pinned (see OME-567).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
