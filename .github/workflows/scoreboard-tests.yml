name: Scoreboard Tests

on:
  push:
    paths:
      - "apps/scoreboard/**"
      - ".github/workflows/scoreboard-tests.yml"
  pull_request:
    paths:
      - "apps/scoreboard/**"
      - ".github/workflows/scoreboard-tests.yml"
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/scoreboard

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # WHY before `uv sync`: sync SILENTLY regenerates a stale lock, so a lockfile that no
      # longer matches pyproject.toml is invisible to every later step — including the
      # version bump a release PR makes and never locks.
      - name: Check the lockfile is current
        run: uv lock --check

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff check)
        run: uv run ruff check --output-format=github

      - name: Lint (ruff format)
        run: uv run ruff format --check

      - name: Typecheck
        run: uv run pyright

      # WHY pinned: the invocation below is version-sensitive. On Node 24
      # `node --test <dir>` resolves the directory as a module and fails, so a silent
      # runner-default upgrade could change what this step does. Pin it deliberately.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # The portal's pure logic (which row may be presented as SOTA, ordering, bar
      # scaling), under Node's built-in runner. No package.json, no vitest, no
      # lockfile, no dependabot ecosystem — Node is the whole harness.
      #
      # AIDEV-NOTE: the file is NAMED EXPLICITLY and must stay that way. Measured on
      # Node v24.10.0:
      #   node --test tests/portal/            -> fails, resolves the dir as a module
      #   node --test "tests/portal/*.test.js" -> exit 0, "pass 0" when nothing matches
      #   node --test tests/portal/*.test.js   -> identical; Node expands globs itself,
      #                                           so shell quoting makes no difference
      # Both glob forms would leave this step permanently GREEN while running zero
      # tests the moment a file is renamed — worse than having no step, because it
      # reads as coverage. A missing explicit path exits 1. Add new test files here
      # by name; the same command is in .claude/sdlc.local.md so local gates and CI
      # cannot disagree (OME-798).
      - name: Run portal JS tests
        run: node --test tests/portal/leaderboard-logic.test.js

      - name: Run unit tests with aggregate coverage
        run: |
          uv run pytest \
            --tb=short \
            --junitxml=results.xml \
            --cov=scoreboard \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -v

      - name: Test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Scoreboard Test Results
          path: apps/scoreboard/results.xml
          reporter: java-junit

      - name: Coverage report
        uses: orgoro/coverage@v3.3
        if: always() && github.event_name == 'pull_request'
        with:
          coverageFile: apps/scoreboard/coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdAll: 0.80

  cost:
    name: CI cost diff
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: HupBaHa/cost-diff@v0.1.2
        with:
          current-job-id: ${{ job.check_run_id }}
          baseline-event: push
          comment-mode: update
