name: screamingface Tests

on:
  push:
    paths:
      - "docs/spec/fixtures/ome_400/**"
      - "packages/screamingface/**"
      - "packages/url4/**"
      - ".github/workflows/screamingface-tests.yml"
  pull_request:
    paths:
      - "docs/spec/fixtures/ome_400/**"
      - "packages/screamingface/**"
      - "packages/url4/**"
      - ".github/workflows/screamingface-tests.yml"
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/screamingface

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra notebook --extra datasets

      - name: Lint
        run: uv run ruff check --output-format=github

      - name: Format
        run: uv run ruff format --check

      - name: Typecheck
        run: uv run pyright

      - name: Test and coverage
        run: |
          uv run pytest \
            --tb=short \
            --junitxml=results.xml \
            --cov=screamingface \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=95 \
            -v

      - name: Test engine-profile app coverage
        run: |
          PYTHONPATH=apps/screamingface-engine/src uv run pytest \
            apps/screamingface-engine/tests \
            --cov=screamingface_engine \
            --cov-fail-under=95 \
            -q

      - name: Construct Phase 0 contract fixtures
        run: uv run python scripts/check_phase1_fixtures.py

      - name: Regenerate Phase 1 walkthrough
        run: |
          uv run --extra notebook python scripts/build_phase1_engine_profile.py
          git diff --exit-code -- examples/phase_1_engine_profile.ipynb

      - name: Build distributions
        run: uv build

      - name: Test report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: screamingface Test Results
          path: packages/screamingface/results.xml
          reporter: java-junit

      - name: Coverage report
        uses: orgoro/coverage@v3.2
        if: always() && github.event_name == 'pull_request'
        with:
          coverageFile: packages/screamingface/coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdAll: 0.95
