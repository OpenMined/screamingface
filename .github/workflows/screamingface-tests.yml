name: screamingface Tests

on:
  push:
    paths:
      - "packages/screamingface/**"
      - "packages/url4/**"
      - ".github/workflows/screamingface-tests.yml"
  pull_request:
    paths:
      - "packages/screamingface/**"
      - "packages/url4/**"
      - ".github/workflows/screamingface-tests.yml"
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/screamingface

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra notebook

      - name: Lint
        run: uv run ruff check --output-format=github

      - name: Format
        run: uv run ruff format --check

      - name: Typecheck
        run: uv run pyright

      - name: Test and coverage
        run: |
          uv run pytest \
            --tb=short \
            --junitxml=results.xml \
            --cov=screamingface \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=95 \
            -v

      - name: Execute quickstarts from clean kernels
        run: |
          uv run --project ../url4 --extra server \
            python ../screamingface/scripts/url4_test_server.py \
            >/tmp/screamingface-url4.log 2>&1 &
          url4_pid=$!
          trap 'kill "$url4_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4404/healthz >/dev/null; then
              break
            fi
            if ! kill -0 "$url4_pid" 2>/dev/null; then
              cat /tmp/screamingface-url4.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4404/healthz >/dev/null
          uv run --extra notebook python scripts/build_quickstart.py --execute
          uv run --extra notebook python scripts/build_sf_url4_engine.py --execute
          git diff --exit-code -- \
            examples/00_quickstart.ipynb \
            examples/sf_url4_engine.ipynb

      - name: Build distributions
        run: uv build

      - name: Test report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: screamingface Test Results
          path: packages/screamingface/results.xml
          reporter: java-junit

      - name: Coverage report
        uses: orgoro/coverage@v3.2
        if: always() && github.event_name == 'pull_request'
        with:
          coverageFile: packages/screamingface/coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdAll: 0.95
