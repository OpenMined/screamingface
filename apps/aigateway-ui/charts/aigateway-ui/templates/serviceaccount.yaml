{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aigateway-ui.serviceAccountName" . }}
  labels:
    {{- include "aigateway-ui.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The console calls no Kubernetes API — it talks to aigateway over HTTP and nothing else. Mounting
# a token would hand a compromised admin console a cluster credential it has no use for.
automountServiceAccountToken: false
{{- end }}
