apiVersion: v1
kind: Pod
metadata:
  name: {{ include "aigateway-ui.fullname" . }}-test-connection
  labels:
    {{- include "aigateway-ui.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    # /healthz deliberately does not call aigateway, so this proves the console is serving HTTP —
    # not that the admin API is reachable. Those are separate questions and this answers the one
    # a chart test can answer without an admin identity.
    - name: curl
      image: curlimages/curl:8.11.1
      command:
        - sh
        - -c
        - curl -fsS "http://{{ include "aigateway-ui.fullname" . }}:{{ .Values.service.port }}/healthz"
