{{- include "aigateway.validateAuth" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aigateway.fullname" . }}
  labels:
    {{- include "aigateway.labels" . | nindent 4 }}
data:
  AIGW_HOST: {{ .Values.config.host | quote }}
  AIGW_PORT: {{ .Values.config.port | quote }}
  AIGW_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  # How the caller is established. Resolved from `config.authMode`, with the legacy
  # `config.authEnabled: false` still meaning `disabled` (see the `aigateway.authMode` helper).
  #
  # INVARIANT: `AIGATEWAY_AUTH_ENABLED` is deliberately NOT emitted alongside it. The app accepts
  # both but rejects them when they disagree, so a chart sending both would have two ways to say
  # one thing — the chart resolves the pair and sends only the mode.
  AIGW_AUTH_MODE: {{ include "aigateway.authMode" . | quote }}
  # Comma-separated, because the app parses a list rather than JSON. Emitted in every mode; only
  # `cloudflare_headers` reads it, and only there is it mandatory.
  AIGW_ALLOWED_NETWORKS: {{ join "," .Values.config.allowedNetworks | quote }}
  # Who may drive the `/v1/admin` surface. Comma-separated for the same reason as the line above:
  # the field is declared `Annotated[frozenset[str], NoDecode]`, and without `NoDecode`
  # pydantic-settings would JSON-decode a complex type from the environment and reject a comma
  # list as malformed JSON before any validator ran.
  #
  # Emitted even when empty, and that empty value is a real posture rather than a missing key: no
  # entries means the admin API answers 503 to everyone, so the surface ships OFF. Sending the key
  # regardless keeps "nobody may administer" a stated decision instead of an accident of absence.
  AIGATEWAY_ADMIN_EMAILS: {{ join "," .Values.config.adminEmails | quote }}
  AIGATEWAY_JWT_TTL_SECONDS: {{ .Values.config.jwtTtlSeconds | quote }}
  AIGATEWAY_PUBLIC_URL: {{ .Values.publicUrl | quote }}
  # The OpenRouter plugin's own gate (`AIGW_OPENROUTER_` prefix). Emitted in every case so the
  # value is declared rather than defaulted-by-absence: a disabled plugin contributes no models
  # and holds no credential strategy, so `false` is a real posture, not a missing key.
  AIGW_OPENROUTER_ENABLED: {{ .Values.config.openrouter.enabled | quote }}
