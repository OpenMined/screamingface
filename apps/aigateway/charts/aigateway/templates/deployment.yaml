apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aigateway.fullname" . }}
  labels:
    {{- include "aigateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "aigateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aigateway.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "aigateway.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: aigateway
          image: {{ include "aigateway.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
          envFrom:
            - configMapRef:
                name: {{ include "aigateway.fullname" . }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- with .Values.extraEnv }}
            {{- /* INVARIANT: extras are emitted FIRST, before the secret-backed entries
                   below. Kubernetes applies duplicate env names last-wins, so putting
                   these first means an extraEnv entry can never shadow
                   AIGATEWAY_DATABASE_URL / _JWT_SECRET / _ADMIN_PASSWORD — the chart's
                   own wiring always takes precedence over operator-supplied extras. */}}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            - name: AIGATEWAY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.existingSecret is required" .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey }}
            - name: AIGATEWAY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "aigateway.authSecretName" . }}
                  key: {{ .Values.auth.jwtSecretKey }}
            - name: AIGATEWAY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "aigateway.authSecretName" . }}
                  key: {{ .Values.auth.adminPasswordKey }}
            - name: AIGATEWAY_PROVISIONING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "aigateway.authSecretName" . }}
                  key: {{ .Values.auth.provisioningTokenKey }}
                  optional: true
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
