apiVersion: v1
kind: Pod
metadata:
  name: {{ include "aigateway.fullname" . }}-test-connection
  labels:
    {{- include "aigateway.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      command:
        - sh
        - -c
        - curl -fsS "http://{{ include "aigateway.fullname" . }}:{{ .Values.service.port }}/healthz"
