# OAuth pending state is process-local until the D-AIGW-009 pending-state follow-up.
replicaCount: 1

publicUrl: https://gateway.screamingface.ai

auth:
  createSecret: true
  existingSecret: aigw-auth

database:
  existingSecret: aigw-db
  existingSecretKey: database-url

# The caller arrives already identified: Cloudflare Access authenticates them at the edge and the
# mesh gateway re-verifies that assertion before injecting `X-User-Email`, which this gateway reads
# directly. Automation using Cloudflare service tokens is not supported in this mode.
config:
  authMode: cloudflare_headers
  # DELIBERATELY EMPTY HERE. The admin allowlist is a deployment-specific list of real people, so
  # it is set at install time (`--set-string 'config.adminEmails[0]=…'` or a private values file),
  # not committed. Left empty the admin API answers 503 to everyone, which is the correct posture
  # for a file that cannot know who the operators are — the console will report "admin API
  # disabled" rather than silently letting anyone in.
  adminEmails: []

# Internal-only. There is no public route to the gateway, and that is load-bearing rather than
# incidental — it is what makes the injected identity headers unforgeable.
ingress:
  enabled: false

# The authentication boundary in `cloudflare_headers` mode: only the url4-cloud App, its Runner
# Jobs, and the admin console may connect.
#
# WHY this is spelled out here rather than left to the chart default: this file previously set
# `enabled: true` and nothing else, and the template omitted `from:` when no CIDRs were given —
# which rendered a policy that admitted every source in the cluster while reading, in this file,
# as though prod were the locked-down environment. The template now refuses to render an empty
# peer set, and the peers are named explicitly so the intent is visible at the deployment level.
networkPolicy:
  enabled: true
  clientPodNames:
    - url4-cloud
    - url4-runner
    # The admin console (OME-710) — a BFF, so it is its Pod that connects here, not a browser.
    - aigateway-ui
