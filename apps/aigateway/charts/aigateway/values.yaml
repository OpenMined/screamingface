replicaCount: 1

image:
  repository: ghcr.io/openmined/screamingface-aigateway
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 1000

config:
  host: 0.0.0.0
  port: 9105
  logLevel: info
  # DEPRECATED — the legacy spelling of `authMode`. `false` still means `authMode: disabled`.
  # Setting it false AND naming a non-disabled `authMode` fails the render rather than picking one.
  authEnabled: true
  # How the gateway establishes who is calling:
  #
  #   cloudflare_headers  trust the `X-User-Email` header the mesh injects. Cloudflare Access
  #                       authenticates at the edge and Envoy re-verifies that assertion before
  #                       injecting it, so the gateway needs no token of its own. Service-token
  #                       callers are NOT supported in this mode. THE CLOUD DEFAULT.
  #   jwt              verify the gateway's own bearer token (accounts + passwords + /v1/auth/login).
  #   disabled         every caller is anonymous; loopback-only, for local development.
  #
  # INVARIANT: `cloudflare_headers` is safe ONLY while this Service is unreachable except through the
  # mesh. Two things enforce that, and both must hold: `ingress.enabled: false` (no direct route in)
  # and the `networkPolicy` below (only the declared peers may connect). The chart refuses to render
  # `cloudflare_headers` together with an enabled Ingress, because that combination lets any caller
  # set X-User-Email and become any principal.
  authMode: cloudflare_headers
  jwtTtlSeconds: 86400

# Only meaningful for the browser-facing OAuth flows, which are unreachable while the gateway is
# internal-only (see `ingress` below). Kept so a deployment that re-exposes the gateway has it.
publicUrl: https://gateway.screamingface.ai

database:
  existingSecret: aigw-db
  existingSecretKey: database-url

auth:
  createSecret: true
  existingSecret: aigw-auth
  jwtSecret: ""
  jwtSecretKey: jwt-secret
  adminPassword: ""
  adminPasswordKey: admin-password
  provisioningToken: ""
  provisioningTokenKey: provisioning-token

service:
  type: ClusterIP
  port: 9105

# DISABLED BY DEFAULT — the gateway is an internal service.
#
# WHY the default flipped: nothing outside the cluster needs to reach this port. url4-cloud and the
# Runner Pods call it over the cluster network, and with `config.authMode: cloudflare_headers` the
# absence of a public route is what makes the identity headers trustworthy — an Ingress here would
# let anyone claim any principal with a single header.
#
# Enabling it is a deliberate act with a consequence: the chart will refuse to render unless you
# also move `config.authMode` off `cloudflare_headers`. If you need the browser-facing flows (the
# provider-credential UI, OAuth callbacks), route them through the same mesh gateway that injects
# identity rather than opening a second, unauthenticated front door.
ingress:
  enabled: false
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
  hosts:
    - host: gateway.screamingface.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: aigw-tls-staging
      hosts:
        - gateway.screamingface.ai

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5

migration:
  enabled: true
  serviceAccountName: default
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  annotations: {}

# Who may reach the gateway. With `config.authMode: cloudflare_headers` this is not hardening — it IS
# the authentication boundary, which is why it defaults to on.
networkPolicy:
  enabled: true
  # Namespace holding the url4-cloud App and its Runner Jobs. Empty => this release's namespace,
  # which is the usual single-namespace install. Matched on the `kubernetes.io/metadata.name` label
  # Kubernetes sets on every namespace.
  clientNamespace: ""
  # `app.kubernetes.io/name` of each client Pod allowed in `clientNamespace`. Two entries because
  # the App and the Runner Jobs share no label: the App carries the url4-cloud chart's name, and
  # each Job carries `url4-runner` (adapters/k8s.py RUNNER_LABELS).
  #
  # Every entry becomes its own `from` element pairing the namespace AND pod selector, so a name
  # here admits only that workload in that namespace — never the whole namespace.
  clientPodNames:
    - url4-cloud
    - url4-runner
  # Extra CIDRs, e.g. a mesh gateway outside the cluster network.
  ingressCIDRs: []
  # Escape hatch: raw NetworkPolicyPeer entries appended verbatim, for a topology the two settings
  # above cannot express (a differently-labelled client, a second namespace).
  allowFrom: []

nodeSelector: {}
tolerations: []
affinity: {}
