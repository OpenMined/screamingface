replicaCount: 1

image:
  repository: ghcr.io/openmined/screamingface-aigateway
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 1000

config:
  host: 0.0.0.0
  port: 9105
  logLevel: info
  authEnabled: true
  jwtTtlSeconds: 86400

publicUrl: https://gateway.screamingface.ai

database:
  existingSecret: aigw-db
  existingSecretKey: database-url

auth:
  createSecret: true
  existingSecret: aigw-auth
  jwtSecret: ""
  jwtSecretKey: jwt-secret
  adminPassword: ""
  adminPasswordKey: admin-password
  provisioningToken: ""
  provisioningTokenKey: provisioning-token
  # Key (inside existingSecret) holding the AES master key for credential_blobs
  # (env AIGATEWAY_SECRET_KEY; base64 of exactly 32 bytes). Empty = not rendered
  # (single-replica dev keeps today's behavior). Set for any hosted deployment.
  secretKeyKey: ""

# Extra environment variables appended verbatim to the container (e.g. provider
# enablement flags such as AIGW_OPENROUTER_ENABLED). List of EnvVar objects.
extraEnv: []

service:
  type: ClusterIP
  port: 9105

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
  hosts:
    - host: gateway.screamingface.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: aigw-tls-staging
      hosts:
        - gateway.screamingface.ai

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5

migration:
  enabled: true
  serviceAccountName: default
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  annotations: {}

networkPolicy:
  enabled: false
  ingressCIDRs: []

nodeSelector: {}
tolerations: []
affinity: {}
