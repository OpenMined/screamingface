[project]
name = "aigateway"
version = "0.2.0"
description = "LiteLLM-compatible AI gateway: unified OpenAI-shape API in front of Anthropic / OpenAI / Gemini / Ollama"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    "httpx>=0.28",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "litellm>=1.94.1",
    "tortoise-orm[asyncpg]==1.1.7",
    "PyJWT==2.12.1",
    "bcrypt==5.0.0",
    "asyncpg==0.31.0",
    "aiosqlite==0.22.1",
    "cryptography==50.0.0",
]

[project.scripts]
aigateway = "aigateway.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aigateway"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C901", "PLR0911", "PLR0912", "PLR0915", "PLR1702"]

[tool.ruff.lint.mccabe]
# Day-1 threshold — see apps/aigateway/docs/complexity-baseline.md
max-complexity = 25

[tool.ruff.lint.pylint]
# Day-1 thresholds — see apps/aigateway/docs/complexity-baseline.md
max-statements = 76
max-branches = 24
max-returns = 8

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests", "src/aigateway"]
markers = [
    "live: tests hitting real upstream providers (skipped in CI)",
    "needs_postgres: tests requiring Postgres/testcontainers",
]
filterwarnings = [
    "error::DeprecationWarning:aigateway",
    "ignore::DeprecationWarning:tortoise",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=5",
    "pyright>=1.1.411",
    "ruff>=0.16.1",
    "httpx>=0.28",
    "testcontainers[postgres]==4.15.0",
]
