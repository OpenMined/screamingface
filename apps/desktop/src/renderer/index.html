<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScreamingFace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rubik:wght@400;500;600;700&family=Sometype+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      #root {
        height: 100%;
      }

      body {
        margin: 0;
        background: #14121a;
        color: #fcfcfd;
        font-family: Inter, system-ui, sans-serif;
      }

      .boot-screen {
        align-items: center;
        display: flex;
        height: 100%;
        justify-content: center;
      }

      .boot-card {
        background: #1e1b26;
        border: 1px solid #2e2a3a;
        border-radius: 14px;
        box-shadow: 0 24px 70px rgb(0 0 0 / 0.28);
        min-width: 260px;
        padding: 24px;
      }

      .boot-title {
        color: #f8c073;
        font-family: Rubik, system-ui, sans-serif;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.01em;
        margin: 0 0 8px;
      }

      .boot-copy {
        color: #8a8699;
        font-size: 13px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen">
        <div class="boot-card">
          <p class="boot-title">screamingface</p>
          <p class="boot-copy">Starting desktop control plane...</p>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
