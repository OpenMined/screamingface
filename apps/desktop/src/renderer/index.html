<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScreamingFace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      #root {
        height: 100%;
      }

      /* Brand: true dark, Plex Sans body, flat/square/hairline */
      body {
        margin: 0;
        background: #0a0b0d;
        color: #e8eaed;
        font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
      }

      .boot-screen {
        align-items: center;
        display: flex;
        height: 100%;
        justify-content: center;
      }

      .boot-card {
        background: #131519;
        border: 1px solid #20232a;
        border-radius: 0;
        min-width: 260px;
        padding: 24px;
      }

      .boot-title {
        color: #e0a23c;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.01em;
        margin: 0 0 8px;
      }

      .boot-copy {
        color: #9aa0aa;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 12px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen">
        <div class="boot-card">
          <p class="boot-title">screamingface</p>
          <p class="boot-copy">Starting desktop control plane...</p>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
