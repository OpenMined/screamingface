nameOverride: ""
fullnameOverride: ""

image:
  repository: postgres
  tag: 16-alpine
  pullPolicy: IfNotPresent

auth:
  username: app
  password: ""
  database: app

secret:
  name: ""
  databaseUrlKey: database-url
  scheme: postgres

service:
  port: 5432

persistence:
  enabled: true
  storageClass: local-path
  accessModes:
    - ReadWriteOnce
  size: 4Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5

livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 20
  timeoutSeconds: 5
