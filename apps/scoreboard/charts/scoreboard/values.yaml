replicaCount: 1

image:
  repository: ghcr.io/openmined/screamingface-scoreboard
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 10001

config:
  host: 0.0.0.0
  port: 9106
  logLevel: info
  portalDir: /app/web/portal
  portalArtifactsDir: /app/web/artifacts
  forwardedAllowIps: "*"
  # disabled (default) trusts the client-supplied submitted_by free text, matching
  # today's behavior. cloudflare_headers requires and trusts the X-User-Email identity
  # header the mesh gateway injects — only sound where this service is reachable
  # exclusively through that mesh (OME-404).
  authMode: disabled
  allowedNetworks: ""

cors:
  origins:
    - "*"

database:
  existingSecret: scoreboard-db
  existingSecretKey: database-url

service:
  type: ClusterIP
  port: 9106

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: scoreboard.screamingface.ai
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5

migration:
  enabled: true
  serviceAccountName: default
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  annotations: {}

seedBenchmarks:
  enabled: true
  serviceAccountName: default
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  annotations: {}
  # The `revision` of each entry MUST match the Engine benchmark's computed REVISION exactly
  # (apps/url4-cloud/src/url4_cloud/benchmarks/<name>/definition.py). A submission carries the
  # Engine's value, and the board ranks per revision — a mismatch makes every real submission
  # look incomparable to the registered board. Re-copy these whenever a benchmark's dataset or
  # protocol revision changes; seeding is idempotent, so redeploying just moves the value.
  benchmarks:
    # --- Engine benchmarks (OME-775) --------------------------------------------------
    - id: draco
      display_name: DRACO
      description: >-
        A 100-task DRACO reproduction with official score arithmetic. It uses the successor
        Judge model, provider-default reasoning, mixed native/Tavily retrieval, and a
        host-only approximation of the reference blocklist, so its scores are not
        paper-identical.
      dataset_url: https://huggingface.co/datasets/perplexity-ai/draco
      revision: 1c58b3085912e304
    - id: ifeval
      display_name: IFEval
      description: >-
        The canonical 541-prompt instruction-following benchmark, graded by deterministic
        strict and loose verification. Each Case invokes the Candidate exactly once.
      # WHY no dataset_url: the IFEval dataset is vendored inside the Engine
      # (url4_cloud.benchmarks.ifeval.vendor), so no single public URL is authoritative.
      revision: 0b88a52b5f10a6d9
    - id: healthbench-worst30
      display_name: HealthBench Worst-30% Challenge
      description: >-
        The 157 hardest conversations from HealthBench Professional — the 30% that top
        models score worst on. An AI judge grades each answer against a physician-written
        rubric; safety mistakes subtract points, so per-case scores can be negative.
      dataset_url: https://huggingface.co/datasets/openai/healthbench
      revision: 6cd57aee171fbdc4
    # --- Legacy demo entries, deliberately retained (OME-775 D2) -----------------------
    # No Engine revision exists for these; they predate the Engine benchmark catalogue.
    - id: livetruth-latest
      display_name: News Livetruth Latest
      description: OpenMined Livetruth latest demo dataset
      dataset_url: https://scoreboard.screamingface.ai/livetruth-latest.jsonl
    - id: hle
      display_name: News Hallucinations
      description: OpenMined HLE benchmark
      dataset_url: https://github.com/openmined/HLE.jsonl
    - id: livetruth
      display_name: News Livetruth
      description: OpenMined Livetruth benchmark
      dataset_url: https://scoreboard.screamingface.ai/livetruth-masking.dataset.jsonl
networkPolicy:
  enabled: false
  ingressCIDRs: []

nodeSelector: {}
tolerations: []
affinity: {}
