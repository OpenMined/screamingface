replicaCount: 1

image:
  repository: ghcr.io/openmined/screamingface-scoreboard
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 10001

config:
  host: 0.0.0.0
  port: 9106
  logLevel: info

cors:
  origins:
    - "*"

database:
  existingSecret: scoreboard-db
  existingSecretKey: database-url

service:
  type: ClusterIP
  port: 9106

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: scoreboard.screamingface.ai
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5

migration:
  enabled: true
  serviceAccountName: default
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  annotations: {}

seedBenchmarks:
  enabled: true
  serviceAccountName: default
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  annotations: {}
  benchmarks:
    - id: hle
      display_name: News Hallucinations
      description: OpenMined HLE benchmark
      dataset_url: https://github.com/openmined/HLE.jsonl
    - id: livetruth
      display_name: News Livetruth
      description: OpenMined Livetruth benchmark
      dataset_url: https://screamingface.ai/livetruth-masking.dataset.jsonl
networkPolicy:
  enabled: false
  ingressCIDRs: []

nodeSelector: {}
tolerations: []
affinity: {}
