[project]
name = "scoreboard"
version = "0.1.0"
description = "ScreamingFace benchmark scoreboard service"
requires-python = ">=3.12"
dependencies = [
    "aerich>=0.8",
    "fastapi>=0.115",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "tortoise-orm[asyncpg]==1.1.7",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
scoreboard = "scoreboard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scoreboard"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:scoreboard",
    "ignore::DeprecationWarning:tortoise",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pyright>=1.1.393",
    "pytest>=9.0",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.8",
]
