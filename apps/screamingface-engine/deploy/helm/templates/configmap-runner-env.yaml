{{/*
The Runner Job's DEPLOY-TIME environment.

Every key here is injected into each Runner Job wholesale via `envFrom` (K8sJobRunner._env_from),
so the chart names the variable AND supplies its value — the App never learns these names and
cannot drift from them. Only PER-RUN values (topic, expression, traceparent, the caller's
credential) are still built in Python, because they do not exist until a request arrives.

INVARIANT: keys are the literal env-var names the run mode reads (`screamingface_engine/job_env.py`),
NOT the App's `URL4_CLOUD_*` Settings names — `envFrom` does no renaming. `URL4_CLOUD_NATS_URL`
looks like a Settings key but is the Runner's own variable and happens to share the spelling.

Rendered unconditionally: an empty ConfigMap is harmless, and always having it means the Job's
`envFrom` reference is stable across upgrades that turn an optional value on or off.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "screamingface-engine.fullname" . }}-runner-env
  labels:
    {{- include "screamingface-engine.labels" . | nindent 4 }}
data:
  # Where the Runner publishes its run log. Its own fallback is loopback, which inside a Job Pod
  # is that Pod — so this must name the NATS Service to reach it.
  URL4_CLOUD_NATS_URL: {{ include "screamingface-engine.natsUrl" . | quote }}
  {{- with .Values.config.aigatewayBaseUrl }}
  # The Runner's fallback is loopback too, with the same consequence.
  AIGATEWAY_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.aigatewayModel }}
  # Overrides the default route declared in the Runner image's url4.toml. Before this ConfigMap
  # the Runner read AIGATEWAY_MODEL but no adapter ever wrote it, so a deployment had no way to
  # set it; now it does.
  AIGATEWAY_MODEL: {{ . | quote }}
  {{- end }}
