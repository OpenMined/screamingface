# url4-cloud Runner declared world.
#
# A model route is always exactly "/" + its AI Gateway model id. Benchmark-owned deterministic
# routes are installed in-process from the Python registry and therefore do not belong here.
# Retrieval is opt-in per model. ``native_web_search`` asks the provider to search;
# ``web_tools`` uses the Runner's guarded Tavily loop when native search is unavailable or cannot
# apply DRACO's domain exclusions. Never enable both mechanisms on one route.

[aigateway]
base_url = "http://127.0.0.1:9105"
default_route = "/anthropic/claude-haiku-4-5"

# A deep-research answer or long judge call regularly exceeds the generic 60-second default.
timeout_s = 600.0

# Tavily-backed routes can spend several rounds gathering sources before producing an answer.
# This mirrors DRACO's published max_calls_per_row numerically, although a Runner round is not
# identical to a call-per-row budget and should not be reported as such.
web_tool_max_iterations = 12

allow_outbound = true

# Credential-free route used by the desktop sidecar's end-to-end readiness check. It exercises
# the real token, WebSocket, in-process runner, URL4 executor, and result path without spending.
[data]
"/desktop-runtime-smoke" = { value = "screamingface-runtime-ok", media_type = "text/plain" }

# Anthropic. Tool calling remains off until it is verified end-to-end for this provider path.
[[aigateway.models]]
id = "anthropic/claude-opus-4-8"

[[aigateway.models]]
id = "anthropic/claude-opus-4-7"

[[aigateway.models]]
id = "anthropic/claude-sonnet-4-6"

[[aigateway.models]]
id = "anthropic/claude-sonnet-4-5"

[[aigateway.models]]
id = "anthropic/claude-haiku-4-5"

# Codex OAuth routes. Tool calling remains off until verified through this backend.
[[aigateway.models]]
id = "codex/gpt-5.5"

[[aigateway.models]]
id = "codex/gpt-5.4"

[[aigateway.models]]
id = "codex/gpt-5.4-mini"

[[aigateway.models]]
id = "codex/gpt-5.3-codex"

[[aigateway.models]]
id = "codex/gpt-5.2"

# Gemini CLI / Code Assist routes. Tool calling remains off until verified through this backend.
[[aigateway.models]]
id = "gemini-cli/gemini-3.1-flash-lite"

[[aigateway.models]]
id = "gemini-cli/gemini-2.5-pro"

[[aigateway.models]]
id = "gemini-cli/gemini-2.5-flash"

[[aigateway.models]]
id = "gemini-cli/gemini-2.5-flash-lite"

[[aigateway.models]]
id = "antigravity/gemini-3-flash"

# OpenRouter seeds. These ids must match the AI Gateway registry exactly; the cross-package
# declaration test fails if the two lists drift.
[[aigateway.models]]
id = "openrouter/openai/gpt-5.5"
native_web_search = true

[[aigateway.models]]
id = "openrouter/anthropic/claude-opus-4.8"
native_web_search = true

[[aigateway.models]]
id = "openrouter/anthropic/claude-haiku-4.5"

[[aigateway.models]]
id = "openrouter/anthropic/claude-fable-5"
native_web_search = true

# Gemini Pro has two DRACO roles. Candidate Invocations enable this Tavily capability, while the
# Benchmark's Judge call explicitly pins ``web_search=false`` and therefore receives no tools.
[[aigateway.models]]
id = "openrouter/google/gemini-3.1-pro-preview"
web_tools = true

# Remaining DRACO / small-model lineup. These routes use the Runner-owned Tavily loop: native
# search either returns 404 or, for Google, cannot apply the benchmark's required blocklist.
[[aigateway.models]]
id = "openrouter/google/gemini-3-flash-preview"
web_tools = true

[[aigateway.models]]
id = "openrouter/moonshotai/kimi-k2.6"
web_tools = true

[[aigateway.models]]
id = "openrouter/moonshotai/kimi-k3"
web_tools = true


[[aigateway.models]]
id = "openrouter/deepseek/deepseek-v4-pro"
web_tools = true

[[aigateway.models]]
id = "openrouter/qwen/qwen3.6-plus"
web_tools = true
