[project]
name = "screamingface"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "uvicorn[standard]>=0.34",
    "typer>=0.15",
    "pydantic>=2.0",
    "pydantic-settings>=2.14.2",
    "mitmproxy>=12.2.2",
    "TatSu>=5.12",
    "curl_cffi>=0.15",
    "tortoise-orm>=0.21",
    "uuid6>=2025.0.1",
]

[project.scripts]
sf = "screamingface.cli.main:app"

[project.optional-dependencies]
tracing = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-instrumentation-httpx>=0.41b0",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "arize-phoenix==13.0.3",
    "arize-phoenix-evals<3",
    "arize-phoenix-otel>=0.6",
    "starlette<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screamingface"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C901", "PLR0911", "PLR0912", "PLR0915", "PLR1702"]

[tool.ruff.lint.mccabe]
# Day-1 threshold — see apps/server/docs/complexity-baseline.md
max-complexity = 47

[tool.ruff.lint.pylint]
# Day-1 thresholds — see apps/server/docs/complexity-baseline.md
max-statements = 194
max-branches = 30
max-returns = 12

[tool.pytest.ini_options]
testpaths = ["tests", "src/screamingface/plugins"]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end test using subprocess server",
    "e2e_live: e2e test requiring real Anthropic API key",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.393",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-instrumentation-httpx>=0.41b0",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "arize-phoenix==13.0.3",
    "arize-phoenix-evals<3",
    "arize-phoenix-otel>=0.6",
    "starlette<1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.3",
    "pyyaml>=6.0",
    "pre-commit>=4.6.0",
]
