# SF-78: Simple backend calls — /claude()!intent

- id: simple_math
  description: "Simple arithmetic — /claude()!What is 2+2?"
  ticket: SF-78
  backends: [claude]
  expression: "/claude()!What is 2+2? Reply with just the number."
  expect:
    contains_any: ["4", "four"]
    max_length: 1000
    judge:
      question: "Does the response contain the number 4 (or the word 'four') as the answer to 2+2?"

- id: simple_greeting
  description: "Simple greeting — /claude()!Say hello"
  ticket: SF-78
  backends: [claude]
  expression: "/claude()!Say hello in one word."
  expect:
    max_length: 1000
    judge:
      question: "Is the response a greeting (e.g. hello, hi, hey)?"

- id: simple_factual
  description: "Factual question — capital of Japan"
  ticket: SF-78
  backends: [claude]
  expression: "/claude()!What is the capital of Japan? One word."
  expect:
    max_length: 1000
    judge:
      question: "Does the response identify Tokyo as the capital of Japan?"
