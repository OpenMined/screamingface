# SF-93: Intent broadcasting — !* applies intent to each source

- id: broadcast_intent
  description: "Broadcast intent to each source in group"
  ticket: SF-93
  backends: [claude]
  expression: >-
    (/claude(France)!What is the capital? One word.,
    /claude(Japan)!What is the capital? One word.)!*Confirm your answer in uppercase.
  expect:
    min_length: 3
    judge:
      question: "Does the response contain two capital city names (Paris and Tokyo), and are they at least partially in uppercase?"

- id: broadcast_transform
  description: "Broadcast a transformation to each source"
  ticket: SF-93
  backends: [claude]
  expression: >-
    (/claude()!Say the word cat.,
    /claude()!Say the word dog.)!*Now say the plural form of that word. One word only.
  expect:
    min_length: 3
    judge:
      question: "Does the response contain the words 'cats' and 'dogs' (plural forms)?"
