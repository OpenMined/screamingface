# SF-88: Named/weighted sources + SF-90: Variable references

- id: named_sources
  description: "Named sources — $name references in reducer"
  ticket: SF-88
  backends: [claude]
  expression: >-
    (expert:1:/claude()!What is 2+2? Just the number.,
    novice:1:/claude()!What is 1+1? Just the number.)
    !The expert said $expert and the novice said $novice. Repeat both.
  params:
    processor: /claude
  expect:
    min_length: 5
    judge:
      question: "Does the response mention two different numbers that were provided by an expert and a novice?"

- id: named_sources_different_tasks
  description: "Named sources with semantically different tasks"
  ticket: SF-88
  backends: [claude]
  expression: >-
    (translator:1:/claude()!Translate 'hello' to French. One word.,
    definer:1:/claude()!Define the word 'hello' in one sentence.)
    !The translator said $translator and the definer said $definer. Combine into one sentence.
  params:
    processor: /claude
  expect:
    min_length: 10
    judge:
      question: "Does the response include both a French translation of hello (like 'bonjour') and a definition of the word hello?"

- id: variable_substitution
  description: "Variable reference in reducer instruction"
  ticket: SF-90
  backends: [claude]
  expression: >-
    (fact:1:/claude()!Capital of Germany? One word.)
    !You were told the answer is $fact. Repeat it.
  params:
    processor: /claude
  expect:
    max_length: 300
    judge:
      question: "Does the response mention Berlin?"

- id: variable_substitution_multi
  description: "Multiple variable references in one reducer instruction"
  ticket: SF-90
  backends: [claude]
  expression: >-
    (city:1:/claude()!Capital of Italy? One word.,
    food:1:/claude()!Name a famous Italian dish. One word.)
    !The capital is $city and a famous dish is $food. Confirm both.
  params:
    processor: /claude
  expect:
    min_length: 10
    judge:
      question: "Does the response mention both Rome (or Roma) and a famous Italian dish like pizza or pasta?"
