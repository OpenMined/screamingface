# Codex simple backend calls — /codex()!intent

- id: codex_math
  description: "Codex simple arithmetic"
  ticket: SF-83
  backends: [codex]
  expression: "/codex()!What is 3+5? Reply with just the number."
  expect:
    max_length: 1000
    judge:
      question: "Does the response contain the number 8?"

- id: codex_greeting
  description: "Codex simple greeting"
  ticket: SF-83
  backends: [codex]
  expression: "/codex()!Say hello in one word."
  expect:
    max_length: 1000
    judge:
      question: "Is the response a greeting (hello, hi, hey)?"

- id: codex_factual
  description: "Codex factual question — capital of Japan"
  ticket: SF-83
  backends: [codex]
  expression: "/codex()!What is the capital of Japan? One word."
  expect:
    max_length: 1000
    judge:
      question: "Does the response identify Tokyo as the capital of Japan?"
