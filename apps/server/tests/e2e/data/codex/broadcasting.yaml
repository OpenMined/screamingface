# Codex intent broadcasting — !* applies intent to each source

- id: codex_broadcast_intent
  description: "Codex broadcast intent to each source"
  ticket: SF-83
  backends: [codex]
  expression: >-
    (/codex(France)!What is the capital? One word.,
    /codex(Japan)!What is the capital? One word.)!*Confirm your answer in uppercase.
  expect:
    min_length: 3
    judge:
      question: "Does the response contain two capital city names (Paris and Tokyo)?"

- id: codex_broadcast_transform
  description: "Codex broadcast transformation"
  ticket: SF-83
  backends: [codex]
  expression: >-
    (/codex()!Say the word cat.,
    /codex()!Say the word dog.)!*Now say the plural form of that word. One word only.
  expect:
    min_length: 3
    judge:
      question: "Does the response contain plural forms of animal words?"
