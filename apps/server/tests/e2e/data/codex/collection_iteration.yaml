# Codex collection iteration — source*(body)!intent

- id: codex_collection_jsonl
  description: "Codex JSONL collection iteration"
  ticket: SF-83
  backends: [codex]
  setup_blob:
    content: |
      {"question":"What is 2+2? One word."}
      {"question":"Capital of France? One word."}
      {"question":"Color of sky? One word."}
    content_type: application/jsonl
  expression: "/data/{blob_key}*(/codex($item.question)!Answer briefly)"
  expect:
    min_results: 2
    min_length: 5
    judge:
      question: "Does the response contain answers to multiple questions?"

- id: codex_collection_json_array
  description: "Codex JSON array collection iteration"
  ticket: SF-83
  backends: [codex]
  setup_blob:
    content: '["What is 1+1?","What is 3+3?"]'
    content_type: application/json
  expression: "/data/{blob_key}*(/codex($item)!Reply with just the number.)"
  expect:
    min_results: 1
    min_length: 1
    judge:
      question: "Does the response contain numbers 2 and 6?"

- id: codex_collection_plain_text
  description: "Codex plain text collection iteration"
  ticket: SF-83
  backends: [codex]
  setup_blob:
    content: |
      apple
      banana
      cherry
    content_type: text/plain
  expression: "/data/{blob_key}*(/codex($item)!What color is this fruit? One word.)"
  expect:
    min_results: 2
    min_length: 5
    judge:
      question: "Does the response contain color names for fruits?"
