# Codex context packing — /codex('context')!intent

- id: codex_context_city
  description: "Codex context packing — extract city"
  ticket: SF-83
  backends: [codex]
  expression: "/codex(The capital of France is Paris.)!What city was mentioned? One word."
  expect:
    max_length: 1000
    judge:
      question: "Does the response identify Paris?"

- id: codex_context_number
  description: "Codex context packing — extract number"
  ticket: SF-83
  backends: [codex]
  expression: "/codex(The answer to life is 42.)!What number was mentioned? Just the number."
  expect:
    max_length: 1000
    judge:
      question: "Does the response contain the number 42?"

- id: codex_context_empty_parens
  description: "Codex empty parens backward compat"
  ticket: SF-83
  backends: [codex]
  expression: "/codex()!What color is the sky on a clear day? One word."
  expect:
    max_length: 1000
    judge:
      question: "Does the response identify blue as the color of the sky?"

- id: codex_context_long_passage
  description: "Codex context packing — longer passage"
  ticket: SF-83
  backends: [codex]
  expression: >-
    /codex(Albert Einstein was born in Ulm, Germany in 1879.
    He developed the theory of relativity and won the Nobel Prize in 1921.)
    !In what year was he born? Just the number.
  expect:
    max_length: 1000
    judge:
      question: "Does the response contain 1879 as Einstein's birth year?"

- id: codex_context_multiple_facts
  description: "Codex context packing — pick specific fact"
  ticket: SF-83
  backends: [codex]
  expression: >-
    /codex?q=%28The%20population%20of%20Tokyo%20is%2014%20million.%20The%20population%20of%20Paris%20is%202%20million.%20The%20population%20of%20London%20is%209%20million.%29%21Use%20the%20provided%20population%20facts%20to%20answer%3A%20which%20city%20has%20the%20smallest%20population%3F%20Reply%20with%20one%20word%3A%20the%20city%20name.
  expect:
    max_length: 1000
    contains_any: ["Paris", "paris"]
