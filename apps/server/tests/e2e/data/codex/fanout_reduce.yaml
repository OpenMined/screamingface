# Codex fan-out-reduce — (/codex()!a, /codex()!b)!reducer ?processor=

- id: codex_fanout_three_way
  description: "Codex three-way fan-out with Claude reducer"
  ticket: SF-83
  backends: [codex, claude]
  expression: >-
    (/codex()!What is 2+2? One word.,
    /codex()!Capital of France? One word.,
    /codex()!Color of the sky? One word.)
    !Combine these three facts into a single sentence.
  params:
    processor: /claude
  expect:
    min_length: 15
    max_length: 1000
    judge:
      question: "Does the response combine at least two of: 4, Paris, blue into a sentence?"

- id: codex_fanout_two_way
  description: "Codex two-way fan-out"
  ticket: SF-83
  backends: [codex, claude]
  expression: >-
    (/codex()!Name one prime number under 10. Just the number.,
    /codex()!Name a different prime number under 10. Just the number.)
    !List both numbers separated by a comma.
  params:
    processor: /claude
  expect:
    min_length: 3
    pattern: "\\d"
    judge:
      question: "Does the response contain two prime numbers both less than 10?"

- id: codex_fanout_single
  description: "Codex N=1 fan-out with reducer"
  ticket: SF-83
  backends: [codex, claude]
  expression: "(/codex()!Say hello in one word.)!Pass through exactly."
  params:
    processor: /claude
  expect:
    min_length: 2
    max_length: 1000
    judge:
      question: "Does the response contain a greeting like hello or hi?"

- id: codex_fanout_disagreement
  description: "Codex fan-out with conflicting answers"
  ticket: SF-83
  backends: [codex, claude]
  expression: >-
    (/codex()!Argue that cats are better pets. Two sentences.,
    /codex()!Argue that dogs are better pets. Two sentences.)
    !Summarize both arguments fairly in one sentence.
  params:
    processor: /claude
  expect:
    min_length: 20
    max_length: 1000
    judge:
      question: "Does the response mention both cats and dogs?"

- id: codex_context_plus_fanout
  description: "Codex fan-out with context packing"
  ticket: SF-83
  backends: [codex, claude]
  expression: >-
    (/codex(Earth is the third planet.)!What number planet? Just the number.,
    /codex(Mars is the fourth planet.)!What number planet? Just the number.)
    !Add these two numbers. Just the final number.
  params:
    processor: /claude
  expect:
    min_length: 1
    max_length: 1000
    judge:
      question: "Does the response contain the number 7 (3+4)?"

- id: codex_factual_consensus
  description: "Codex consensus — same factual question twice"
  ticket: SF-83
  backends: [codex, claude]
  expression: >-
    (/codex()!Chemical symbol for water? Just the symbol.,
    /codex()!Chemical formula for water? Just the formula.)
    !Do both answers agree? Reply with the formula.
  params:
    processor: /claude
  expect:
    min_length: 1
    max_length: 1000
    judge:
      question: "Does the response contain H2O?"
