# Gemini fan-out-reduce — (call1, call2)!reducer ?processor=
# Mirrors fanout_reduce.yaml (Claude) for parity.
# Uses /claude as processor since reducer needs a backend to synthesize.

- id: gemini_fanout_three_way
  description: "Three-way fan-out with reducer — combine 3 Gemini facts"
  ticket: SF-84
  backends: [claude, gemini]
  expression: >-
    (/gemini()!What is 2+2? One word.,
    /gemini()!Capital of France? One word.,
    /gemini()!Color of the sky? One word.)
    !Combine these three facts into a single sentence.
  params:
    processor: /claude
  expect:
    min_length: 15
    max_length: 500
    judge:
      question: "Does the response combine at least two of these three facts: 4, Paris, blue — into a coherent sentence?"

- id: gemini_fanout_two_way
  description: "Two-way fan-out — compare two Gemini answers"
  ticket: SF-84
  backends: [claude, gemini]
  expression: >-
    (/gemini()!Name one prime number under 10. Just the number.,
    /gemini()!Name a different prime number under 10. Just the number.)
    !List both numbers separated by a comma.
  params:
    processor: /claude
  expect:
    min_length: 3
    pattern: "\\d"
    judge:
      question: "Does the response contain two prime numbers that are both less than 10?"

- id: gemini_fanout_single_element
  description: "Degenerate N=1 fan-out — single Gemini call + reducer"
  ticket: SF-84
  backends: [claude, gemini]
  expression: "(/gemini()!Say hello in one word.)!Pass through exactly."
  params:
    processor: /claude
  expect:
    min_length: 2
    max_length: 200
    judge:
      question: "Does the response contain a greeting word like hello or hi?"

- id: gemini_fanout_disagreement
  description: "Fan-out with conflicting Gemini answers — reducer must synthesize"
  ticket: SF-84
  backends: [claude, gemini]
  expression: >-
    (/gemini()!Argue that cats are better pets. Two sentences.,
    /gemini()!Argue that dogs are better pets. Two sentences.)
    !Summarize both arguments fairly in one sentence.
  params:
    processor: /claude
  expect:
    min_length: 20
    max_length: 500
    judge:
      question: "Does the response mention both cats and dogs, presenting arguments for each?"

- id: gemini_context_plus_fanout
  description: "Fan-out where each Gemini call uses context packing"
  ticket: SF-84
  backends: [claude, gemini]
  expression: >-
    (/gemini(Earth is the third planet.)!What number planet is mentioned? Just the number.,
    /gemini(Mars is the fourth planet.)!What number planet is mentioned? Just the number.)
    !Add these two numbers together. Just the final number.
  params:
    processor: /claude
  expect:
    min_length: 1
    max_length: 100
    judge:
      question: "Does the response contain the number 7 (3+4)?"

- id: gemini_factual_consensus
  description: "Multiple Gemini calls to same factual question — consensus check"
  ticket: SF-84
  backends: [claude, gemini]
  expression: >-
    (/gemini()!What is the chemical symbol for water? Just the symbol.,
    /gemini()!What is the chemical formula for water? Just the formula.)
    !Do both answers agree? Reply with the formula.
  params:
    processor: /claude
  expect:
    min_length: 1
    max_length: 200
    judge:
      question: "Does the response contain H2O as the chemical formula for water?"
