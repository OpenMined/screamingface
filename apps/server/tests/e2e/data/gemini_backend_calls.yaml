# Gemini backend calls — /gemini()!intent
# Mirrors backend_calls.yaml (Claude) for parity.

- id: gemini_math
  description: "Simple arithmetic — /gemini()!What is 2+2?"
  ticket: SF-84
  backends: [gemini]
  expression: "/gemini()!What is 2+2? Reply with just the number."
  expect:
    contains_any: ["4", "four"]
    max_length: 1000
    judge:
      question: "Does the response contain the number 4 (or the word 'four') as the answer to 2+2?"

- id: gemini_greeting
  description: "Simple greeting — /gemini()!Say hello"
  ticket: SF-84
  backends: [gemini]
  expression: "/gemini()!Say hello in one word."
  expect:
    max_length: 1000
    judge:
      question: "Is the response a greeting (e.g. hello, hi, hey)?"

- id: gemini_factual_capital
  description: "Factual question — capital of Japan"
  ticket: SF-84
  backends: [gemini]
  expression: "/gemini()!What is the capital of Japan? One word."
  expect:
    max_length: 1000
    judge:
      question: "Does the response identify Tokyo as the capital of Japan?"
