# Multi-backend tests — cross-provider ensemble
# Each test lists ALL required backends. If any is unavailable the test
# is skipped with a verbose diagnostic.

# --- Gemini-only (SF-84) ---

- id: gemini_simple_math
  description: "Gemini backend — simple arithmetic"
  ticket: SF-84
  backends: [gemini]
  expression: "/gemini()!What is 7+3? Reply with just the number."
  expect:
    max_length: 100
    judge:
      question: "Does the response contain the number 10?"

- id: gemini_factual
  description: "Gemini backend — factual question"
  ticket: SF-84
  backends: [gemini]
  expression: "/gemini()!What is the chemical symbol for gold? Just the symbol."
  expect:
    max_length: 100
    judge:
      question: "Does the response contain Au as the chemical symbol for gold?"

# --- Claude + Codex ---

- id: cross_claude_codex_fanout
  description: "Cross-provider fan-out — Claude and Codex answer the same question"
  ticket: SF-83
  backends: [claude, codex]
  expression: >-
    (/claude()!What is the capital of France? One word.,
    /codex()!What is the capital of France? One word.)
    !Both providers were asked the same question. Do they agree? State the answer.
  params:
    processor: /claude
  expect:
    min_length: 3
    judge:
      question: "Does the response mention Paris and indicate that both providers agree?"

- id: cross_claude_codex_different_tasks
  description: "Cross-provider — each provider does a different task"
  ticket: SF-83
  backends: [claude, codex]
  expression: >-
    (/claude()!Translate 'thank you' to Spanish. One word or phrase.,
    /codex()!Translate 'thank you' to French. One word or phrase.)
    !Combine both translations into one sentence.
  params:
    processor: /claude
  expect:
    min_length: 10
    judge:
      question: "Does the response contain both 'gracias' (Spanish) and 'merci' (French)?"

# --- Claude + Gemini ---

- id: cross_claude_gemini_fanout
  description: "Cross-provider fan-out — Claude and Gemini"
  ticket: SF-84
  backends: [claude, gemini]
  expression: >-
    (/claude()!Name the largest ocean. One word.,
    /gemini()!Name the largest ocean. One word.)
    !Both answers should be the same. What is it?
  params:
    processor: /claude
  expect:
    min_length: 3
    judge:
      question: "Does the response identify the Pacific as the largest ocean?"

- id: cross_claude_gemini_context
  description: "Cross-provider with context packing — each extracts from same context"
  ticket: SF-84
  backends: [claude, gemini]
  expression: >-
    (/claude(The Eiffel Tower is 330 meters tall and was built in 1889.)!How tall is it? Just the number and unit.,
    /gemini(The Eiffel Tower is 330 meters tall and was built in 1889.)!What year was it built? Just the number.)
    !Combine: height is from the first answer, year from the second.
  params:
    processor: /claude
  expect:
    min_length: 10
    judge:
      question: "Does the response mention both 330 meters (height) and 1889 (year)?"

# --- Three-provider ensemble (the SOTA target) ---

- id: three_provider_consensus
  description: "Three-provider consensus — Claude, Codex, Gemini on same question"
  ticket: SF-94
  backends: [claude, codex, gemini]
  expression: >-
    (/claude()!What is 2+2? Just the number.,
    /codex()!What is 2+2? Just the number.,
    /gemini()!What is 2+2? Just the number.)
    !All three providers answered. Do they all agree? State the answer.
  params:
    processor: /claude
  expect:
    min_length: 1
    judge:
      question: "Does the response contain the number 4 and indicate agreement among all providers?"

- id: three_provider_different_tasks
  description: "Three-provider different specializations"
  ticket: SF-94
  backends: [claude, codex, gemini]
  expression: >-
    (claude_answer:1:/claude()!Translate 'hello' to Japanese. One word.,
    codex_answer:1:/codex()!Translate 'hello' to German. One word.,
    gemini_answer:1:/gemini()!Translate 'hello' to Italian. One word.)
    !Claude said $claude_answer, Codex said $codex_answer, Gemini said $gemini_answer. List all three translations.
  params:
    processor: /claude
  expect:
    min_length: 10
    judge:
      question: "Does the response contain translations of 'hello' in three languages — Japanese, German, and Italian?"

- id: three_provider_weighted_consensus
  description: "Weighted three-provider consensus — Claude weighted higher"
  ticket: SF-94
  backends: [claude, codex, gemini]
  expression: >-
    (claude:3:/claude()!Is Python dynamically typed? Yes or no.,
    codex:1:/codex()!Is Python dynamically typed? Yes or no.,
    gemini:1:/gemini()!Is Python dynamically typed? Yes or no.)
    !Summarize the consensus. Claude's opinion has 3x weight.
  params:
    processor: /claude
  expect:
    min_length: 5
    judge:
      question: "Does the response indicate that Python is dynamically typed, with consensus among providers?"

# --- Codex + Gemini ---

- id: cross_codex_gemini
  description: "Codex + Gemini fan-out — no Claude involved except reducer"
  ticket: SF-83
  backends: [claude, codex, gemini]
  expression: >-
    (/codex()!Name a programming language that starts with P. One word.,
    /gemini()!Name a programming language that starts with J. One word.)
    !List both languages.
  params:
    processor: /claude
  expect:
    min_length: 5
    judge:
      question: "Does the response list two programming languages, one starting with P and one starting with J?"

# --- Multi-backend collection iteration ---

- id: collection_multi_backend
  description: "Collection iteration dispatching to different backends per item"
  ticket: SF-94
  backends: [claude, codex]
  setup_blob:
    content: |
      {"backend":"claude","question":"What is 5+5? Just the number."}
      {"backend":"codex","question":"What is 6+6? Just the number."}
    content_type: application/jsonl
  expression: "/data/{blob_key}*(/$item.backend()!$item.question)"
  expect:
    min_results: 1
    min_length: 1
    judge:
      question: "Does the response contain the numbers 10 and 12?"
