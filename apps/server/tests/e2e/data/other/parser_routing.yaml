# Non-live tests — no backend needed, test parser/routing only

- id: unknown_backend_error
  description: "Unknown backend path returns 502"
  ticket: SF-78
  backends: []
  expression: "/nonexistent()!hello"
  expect:
    status: 502

- id: empty_expression_error
  description: "Missing q= returns 400"
  ticket: SF-78
  backends: []
  expression: ""
  expect:
    status: 400

- id: data_store_roundtrip
  description: "Store and retrieve a blob via /data"
  ticket: SF-91
  backends: []
  setup_blob:
    content: "test roundtrip content"
    content_type: text/plain
  expression: "/data/{blob_key}"
  raw_get: true
  expect:
    status: 200
    contains_all: ["test roundtrip content"]
