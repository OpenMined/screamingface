apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "url4-cloud.fullname" . }}
  labels:
    {{- include "url4-cloud.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "url4-cloud.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "url4-cloud.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # The RBAC subject: this ServiceAccount is bound to the namespace Role that permits scheduling
      # Runner Jobs (spec §9). The stateless App calls create/get/list/watch/delete on batch/jobs.
      serviceAccountName: {{ include "url4-cloud.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: url4-cloud
          image: {{ include "url4-cloud.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - url4-cloud
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
          envFrom:
            - configMapRef:
                name: {{ include "url4-cloud.fullname" . }}
          env:
            # HS256 topic-capability signing secret (spec §4). Never logged.
            - name: URL4_CLOUD_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "url4-cloud.authSecretName" . }}
                  key: {{ .Values.auth.jwtSecretKey }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
