{{- if .Values.runner.renderTemplate -}}
# Runner Job template — spec §9. Rendered as a ConfigMap, NOT a live Job on purpose: the App builds
# the real per-request Job in code (url4_cloud.jobs.k8s.K8sJobRunner._manifest) with a deterministic
# name url4-<hash(topic)> — the stateless single-use 409 guard. This ConfigMap is the operator
# reference so the scheduled shape is reviewable and its labels are known to match the Role above.
#
# Fidelity: run-once (backoffLimit:0 / restartPolicy:Never), activeDeadlineSeconds = 16 h ceiling,
# and app.kubernetes.io labels exactly as url4_cloud.jobs.port.RUNNER_LABELS. Per-request fields
# (<topic>, <url4-expression>) are injected by the App at schedule time.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "url4-cloud.fullname" . }}-runner-job-template
  labels:
    {{- include "url4-cloud.labels" . | nindent 4 }}
data:
  job-runner.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: url4-<hash(topic)>          # deterministic; a name collision IS the single-use guard
      labels:
        app.kubernetes.io/name: url4-runner
        app.kubernetes.io/part-of: url4-cloud
        app.kubernetes.io/component: job
    spec:
      backoffLimit: 0                     # run-once: retry = new token/new job (spec §2.3)
      activeDeadlineSeconds: {{ .Values.config.jobDeadlineS }}   # 16 h hard timeout => timed_out
      template:
        metadata:
          labels:
            app.kubernetes.io/name: url4-runner
            app.kubernetes.io/part-of: url4-cloud
            app.kubernetes.io/component: job
        spec:
          restartPolicy: Never
          containers:
            - name: runner
              image: {{ include "url4-cloud.runnerImage" . | quote }}
              command:
                {{- range .Values.runner.command }}
                - {{ . | quote }}
                {{- end }}
              env:
                - name: URL4_CLOUD_TOPIC
                  value: "<topic>"
                - name: URL4_CLOUD_EXPRESSION
                  value: "<url4-expression>"
                - name: URL4_CLOUD_JOB_DEADLINE_S
                  value: {{ .Values.config.jobDeadlineS | quote }}
                - name: URL4_CLOUD_NATS_URL
                  value: {{ .Values.config.natsUrl | quote }}
{{- end }}
