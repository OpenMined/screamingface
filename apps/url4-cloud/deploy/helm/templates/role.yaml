{{- if .Values.rbac.create -}}
# Namespace-scoped RBAC bootstrap (spec §9): the least privilege the stateless App needs to run
# Runner Jobs ONLY in its own namespace. Verbs mirror what K8sJobRunner calls exactly —
# create/get/list/watch/delete on batch/jobs; get/list on pods (+ pods/log) for status & logs;
# create/delete (deliberately NOT get/list) on secrets — the App creates a per-run Secret to
# forward a caller's aigateway/CF Access credential into the Job by REFERENCE rather than as a
# plaintext Job env value (never a `get`: the App writes the credential, it never reads one back).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "url4-cloud.fullname" . }}
  labels:
    {{- include "url4-cloud.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - delete
{{- end }}
