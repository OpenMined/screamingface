{{- if .Values.rbac.create -}}
# Binds the namespace Role above to the App's ServiceAccount (the Deployment's subject), completing
# the first-deployment RBAC bootstrap so the App may schedule Jobs in this namespace only (spec §9).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "url4-cloud.fullname" . }}
  labels:
    {{- include "url4-cloud.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "url4-cloud.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "url4-cloud.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
