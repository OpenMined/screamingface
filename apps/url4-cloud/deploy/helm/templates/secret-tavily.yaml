{{/*
The Tavily web-tools credential (spec 2026-07-23). Rendered ONLY when the chart owns the Secret —
`tavily.existingSecret` means an operator (or an External Secrets / Sealed Secrets flow) supplies
it out-of-band, which is the recommended prod shape.

INVARIANT: this Secret is referenced by name from each Runner Job's env (K8sJobRunner._env emits a
`valueFrom.secretKeyRef`); the App never reads it, so it needs no `get secrets` RBAC and rotating
this value takes effect on the next scheduled Job without restarting the App.
*/}}
{{- if and .Values.tavily.enabled (not .Values.tavily.existingSecret) }}
{{- $secretName := include "url4-cloud.tavilySecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $apiKey := .Values.tavily.apiKey -}}
{{- if not $apiKey -}}
{{/* WHY: reuse the key already in the cluster so a values-less `helm upgrade` does not wipe it. */}}
{{- if and $existing $existing.data (index $existing.data .Values.tavily.secretKey) -}}
{{- $apiKey = (index $existing.data .Values.tavily.secretKey | b64dec) -}}
{{- else -}}
{{- fail "tavily.enabled requires either tavily.existingSecret or tavily.apiKey" -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "url4-cloud.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.tavily.secretKey }}: {{ $apiKey | quote }}
{{- end }}
