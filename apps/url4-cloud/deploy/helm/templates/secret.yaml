{{- if .Values.auth.create }}
{{- $secretName := include "url4-cloud.authSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $jwtSecret := .Values.auth.jwtSecret -}}
{{- if not $jwtSecret -}}
{{- if and $existing $existing.data (index $existing.data .Values.auth.jwtSecretKey) -}}
{{/* WHY: reuse the already-issued secret across upgrades so live tokens stay valid. */}}
{{- $jwtSecret = (index $existing.data .Values.auth.jwtSecretKey | b64dec) -}}
{{- else -}}
{{- $jwtSecret = randAlphaNum 64 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "url4-cloud.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.jwtSecretKey }}: {{ $jwtSecret | quote }}
{{- end }}
