{{- if .Values.gateway.cloudflareAccess.enabled -}}
{{- if not .Values.gateway.enabled -}}
{{- fail "gateway.cloudflareAccess.enabled=true requires gateway.enabled=true — a SecurityPolicy targets the HTTPRoute this chart renders, and with no route it attaches to nothing and verifies nothing." -}}
{{- end -}}
{{/*
The identity-injecting edge (https://pulse.dev.openmined.org/docs/products/gateway-identity-flow/).

Cloudflare Access authenticates the caller and attaches its signed assertion as
`Cf-Access-Jwt-Assertion`. Envoy RE-VERIFIES that assertion against Cloudflare's JWKS here, then
maps the verified `email` claim onto `X-User-Email` — the single header aigateway resolves the
caller from. The gateway itself does no token work; that is why this object is load-bearing.

INVARIANT: this policy targets the HTTPRoute BY NAME, so it shares that route's lifecycle. A
route renamed without renaming it here would leave the route unprotected while this object still
reports Accepted — which is why both names come from the same helper rather than a value.

INVARIANT: `claimToHeaders` SETS the header rather than appending, so a client-supplied
`X-User-Email` is overwritten by the verified value instead of surviving alongside it. That
matters because aigateway reads the FIRST value of the header; an appending filter would let a
forged copy win, and an authenticated caller could then bill any colleague's credentials.

VERIFIED against Envoy Gateway v1.4.2 with a real Cloudflare Access token (2026-07-30): a forged
`X-User-Email` is replaced, not appended, and that holds for any header casing, for several
forged copies at once, and whether the token arrives in the header or the `CF_Authorization`
cookie. Re-check when upgrading Envoy Gateway — this is the assumption the whole mode rests on.

WHY no `recomputeRoute`: the injected header takes no part in route matching (one catch-all rule),
so recomputing would re-run matching for a result that cannot change.
*/}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ include "url4-cloud.fullname" . }}-cloudflare-access
  labels:
    {{- include "url4-cloud.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "url4-cloud.fullname" . }}
  jwt:
    providers:
      - name: cloudflare-access
        {{- $team := required "gateway.cloudflareAccess.teamDomain is required when cloudflareAccess.enabled=true — the issuer and JWKS URL are derived from it" .Values.gateway.cloudflareAccess.teamDomain }}
        issuer: https://{{ $team }}
        audiences:
          # Scopes acceptance to ONE Access application. Without it any valid token from any
          # application in the same Cloudflare team would authenticate here.
          - {{ required "gateway.cloudflareAccess.audience is required when cloudflareAccess.enabled=true — without an audience check every application in the team is accepted" .Values.gateway.cloudflareAccess.audience | quote }}
        remoteJWKS:
          # Path fixed by Cloudflare; derived from the team domain so the two cannot disagree.
          uri: https://{{ $team }}/cdn-cgi/access/certs
        extractFrom:
          headers:
            # What the Cloudflare edge attaches to a proxied request.
            - name: Cf-Access-Jwt-Assertion
          cookies:
            # The same assertion, as a browser reaching the app directly carries it.
            - CF_Authorization
        claimToHeaders:
          # The whole identity. aigateway keys the account on this value (`Account.username`),
          # so it is both the authentication result and the credential-namespace key.
          - claim: email
            header: X-User-Email
{{- end }}
