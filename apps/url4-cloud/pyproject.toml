# url4-cloud dev/test aggregate (NOT a shipped artifact).
#
# The tree ships ONE app from under `backend/`, built into one image and entered in either of two
# modes (`url4-cloud serve` / `url4-cloud run` — see `url4_cloud.cli`). It used to ship two
# distributions; they were merged because the run mode's dependencies were already a subset of
# the serving mode's, and the split's real cost was three hand-synced duplicate modules.
#
# This pyproject survives the merge because it still earns its keep: it holds the shared
# ruff/pytest/pyright config and the `tests/` tree, which sit ABOVE `backend/` so the suite can
# import the engine (`packages/url4`) alongside the app. It is `package = false` (never built
# into a wheel); the real distribution is `backend/pyproject.toml`, and the image is built from
# `backend/Dockerfile`.
[project]
name = "url4-cloud-dev"
version = "0"
description = "url4-cloud dev/test aggregate — owns the test suite and shared tooling."
requires-python = ">=3.12"
dependencies = [
    "url4-cloud",
]

[tool.uv]
package = false

[tool.uv.sources]
url4-cloud = { path = "backend", editable = true }
url4 = { path = "../../packages/url4", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C901", "PLR0911", "PLR0912", "PLR0915", "PLR1702"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-statements = 26
max-branches = 7
max-returns = 3

# The import packages live across backend/ and packages/url4 — name them explicitly so isort
# treats them as first-party (auto-detection can't, since this project is package = false).
[tool.ruff.lint.isort]
known-first-party = [
    "url4",
    "url4_cloud",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:url4_cloud",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=5",
    "ruff>=0.15.13",
]

# Notebook/example-only aids for .examples/ (not needed by the shipped apps). Mirrors
# packages/url4's `notebook` group: `uv sync --group examples` to run url4_cloud_client
# standalone (e.g. from Jupyter, add .examples/utils to sys.path).
examples = [
    "httpx>=0.28.1",
    "websockets>=13.0",
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
]
