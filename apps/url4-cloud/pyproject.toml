# url4-cloud — ONE distribution, ONE image, TWO modes (`url4-cloud serve` / `url4-cloud run` —
# see `url4_cloud.cli`). It used to ship two distributions; they were merged because the run
# mode's dependencies were already a subset of the serving mode's, and the split's real cost was
# three hand-synced duplicate modules.
#
# This file is BOTH the shipped distribution and the dev/test root: the package under `src/`, the
# `tests/` tree, and the shared ruff/pytest tooling all hang off it. There used to be a second
# `backend/pyproject.toml` beneath a `package = false` aggregate here; the nesting bought nothing
# once the two distributions became one, so it is gone. The image is built from `Dockerfile`.
[project]
name = "url4-cloud"
version = "1.2.1"
description = "url4-cloud — the control plane (REST + WebSocket, schedules Runner Jobs) and the url4 run mode those Jobs execute."
requires-python = ">=3.12"
# Merging the former `url4-cloud-runner` distribution in cost NO new dependency: its deps
# (httpx, nats-py, url4) were already a strict subset of these. What the run mode gains is
# serving-side packages it never imports; the layering gate is what keeps that true.
dependencies = [
    # --- serving mode only ---
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "pyjwt>=2.10.1",
    "kubernetes>=31.0.0",
    "prometheus-client>=0.21.0",
    "pydantic-settings>=2.14.1",
    # --- both modes ---
    "pydantic>=2.13.4",
    # The catalog's upstream aigateway client (`url4_cloud.catalog`), and the run mode's
    # aigateway + Tavily clients (`url4_cloud.runner.connector`).
    "httpx>=0.28.1",
    # Both directions of the run log: the App consumes (`adapters.jetstream.JetStreamConsumer`),
    # the run mode publishes (`JetStreamPublisher`) — one adapter module, shared.
    "nats-py>=2.9.0",
    # The wire contract (`url4.streaming`) and the engine (`url4.dag`) ship in one distribution:
    # the App needs the former, the run mode the latter. The `streaming` extra is what pulls in
    # pydantic — it is NOT a base dependency of the engine, so that embedders who only run
    # expressions do not install a wire-format library they never import.
    "url4[streaming]",
]

[project.scripts]
url4-cloud = "url4_cloud.cli:main"
# COMPATIBILITY ALIAS. The Job's command is now `["url4-cloud", "run"]`, but during a rolling
# upgrade an App pod running the OLD code schedules the NEW image with the old command — the
# image reference comes from the ConfigMap while the command comes from Python, so the two
# change at different moments. Keeping this name resolvable makes that window survivable in
# both directions. Removable one release after the merge ships.
url4-cloud-runner = "url4_cloud.runner.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/url4_cloud"]

[tool.uv.sources]
url4 = { path = "../../packages/url4", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C901", "PLR0911", "PLR0912", "PLR0915", "PLR1702"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-statements = 26
max-branches = 7
max-returns = 3

# `url4` is a path dependency from packages/, so isort cannot infer it as first-party from this
# project's own layout — name both import packages explicitly.
[tool.ruff.lint.isort]
known-first-party = [
    "url4",
    "url4_cloud",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:url4_cloud",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=5",
    "ruff>=0.16.1",
]

# Notebook/example-only aids for .examples/ (not needed by the shipped apps). Mirrors
# packages/url4's `notebook` group: `uv sync --group examples` to run url4_cloud_client
# standalone (e.g. from Jupyter, add .examples/utils to sys.path).
examples = [
    "httpx>=0.28.1",
    "websockets>=17.0.1",
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
]
