[project]
name = "url4-cloud"
version = "0.1.0"
description = "url4-cloud — REST + WebSocket url4 execution runner (k8s Jobs + NATS)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140.13",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "uvicorn[standard]>=0.51.0",
    "pyjwt>=2.10.1",
    "nats-py>=2.9.0",
    "kubernetes>=31.0.0",
    "docker>=7.1.0",
    "prometheus-client>=0.26.0",
]

[project.scripts]
url4-cloud = "url4_cloud.cli:main"
url4-cloud-runner = "url4_cloud_runner.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/url4_cloud",
    "src/url4_cloud_runner",
    "src/url4_cloud_nats",
    "src/url4_streaming_protocol",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C901", "PLR0911", "PLR0912", "PLR0915", "PLR1702"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-statements = 26
max-branches = 7
max-returns = 3

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:url4_cloud",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=5",
    "ruff>=0.16.0",
]
