# url4-cloud dev/test aggregate (NOT a shipped artifact).
#
# The repo ships TWO apps from under this tree — `backend/` (the App) and `runner/` (the
# Runner) — plus two shared libraries under `shared/` (`protocol/`, `bus/`). This pyproject is
# the one place that pulls them all into a single venv so the cross-package test suite and the
# shared ruff/pytest/pyright config run from `apps/url4-cloud` with one `uv sync`. It is
# `package = false` (never built into a wheel); the real distributions are the four pyprojects
# below. Docker images are built per-app from `backend/Dockerfile` and `runner/Dockerfile`.
[project]
name = "url4-cloud-dev"
version = "0"
description = "url4-cloud dev/test aggregate — owns the cross-package test suite and shared tooling."
requires-python = ">=3.12"
dependencies = [
    "url4-cloud", # the backend
    "url4-cloud-runner", # the runner
]

[tool.uv]
package = false

[tool.uv.sources]
url4-cloud = { path = "backend", editable = true }
url4-cloud-runner = { path = "runner", editable = true }
url4-cloud-nats = { path = "shared/bus", editable = true }
url4-streaming-protocol = { path = "shared/protocol", editable = true }
url4 = { path = "../../packages/url4", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C901", "PLR0911", "PLR0912", "PLR0915", "PLR1702"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-statements = 26
max-branches = 7
max-returns = 3

# The four import packages live across backend/, runner/, shared/* — name them explicitly so
# isort treats them as first-party (auto-detection can't, since this project is package = false).
[tool.ruff.lint.isort]
known-first-party = [
    "url4_cloud",
    "url4_cloud_runner",
    "url4_cloud_nats",
    "url4_streaming_protocol",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:url4_cloud",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=5",
    "ruff>=0.15.13",
]

# Notebook/example-only aids for .examples/ (not needed by the shipped apps). Mirrors
# packages/url4's `notebook` group: `uv sync --group examples` to run url4_cloud_client
# standalone (e.g. from Jupyter, add .examples/utils to sys.path).
examples = [
    "httpx>=0.28.1",
    "websockets>=13.0",
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
]
