[project]
name = "url4-cloud-runner"
version = "0.1.0"
description = "url4-cloud Runner — the one-shot url4 execution Job (engine + aigateway connector)."
requires-python = ">=3.12"
dependencies = [
    # httpx is a REAL runtime dep (aigateway + Tavily clients) — previously survived only as a
    # transitive/dev dep of the single distribution; declaring it here is the fix for that.
    "httpx>=0.28.1",
    "url4",
    "url4-cloud-nats",
    "url4-streaming-protocol",
]

[project.scripts]
url4-cloud-runner = "url4_cloud_runner.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
url4 = { path = "../../../packages/url4", editable = true }
url4-cloud-nats = { path = "../shared/bus", editable = true }
url4-streaming-protocol = { path = "../shared/protocol", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/url4_cloud_runner"]
