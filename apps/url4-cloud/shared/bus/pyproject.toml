[project]
name = "url4-cloud-nats"
version = "0.1.0"
description = "The CloudEvents Bus port + JetStream/in-memory adapters shared by the url4-cloud backend and runner."
requires-python = ">=3.12"
dependencies = ["nats-py>=2.9.0", "url4-streaming-protocol"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
url4-streaming-protocol = { path = "../protocol", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/url4_cloud_nats"]
