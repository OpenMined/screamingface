[project]
name = "url4-streaming-protocol"
version = "0.1.0"
description = "CloudEvents 1.0 + OpenTelemetry frame contract shared by the url4-cloud backend and runner."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.13.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/url4_streaming_protocol"]
