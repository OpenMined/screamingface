<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1296" width="1320" height="1296"><style>text{font-family:"JetBrains Mono","DejaVu Sans Mono",monospace;paint-order:stroke fill;stroke:rgba(2,6,23,0.75);stroke-width:1;stroke-linejoin:round;stroke-linecap:round;}</style><rect width="100%" height="100%" fill="#020617"/>
        <defs>
          <marker id="ah" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#64748b" /></marker>
          <marker id="ah-cyan" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#22d3ee" /></marker>
          <marker id="ah-emerald" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#34d399" /></marker>
          <marker id="ah-amber" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#fbbf24" /></marker>
          <marker id="ah-rose" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#fb7185" /></marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- PHASE BANDS -->
        <rect x="20" y="168" width="1280" height="132" rx="8" fill="rgba(167, 139, 250, 0.05)" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3,4"/>
        <rect x="28" y="174" width="232" height="15" rx="3" fill="rgba(15, 23, 42, 0.92)" stroke="rgba(167,139,250,0.6)" stroke-width="1"/>
        <text x="36" y="185" fill="#a78bfa" font-size="9" font-weight="600">Phase 1 — Gateway account login (JWT)</text>

        <rect x="20" y="308" width="1280" height="150" rx="8" fill="rgba(34, 211, 238, 0.05)" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3,4"/>
        <rect x="28" y="314" width="240" height="15" rx="3" fill="rgba(15, 23, 42, 0.92)" stroke="rgba(34,211,238,0.6)" stroke-width="1"/>
        <text x="36" y="325" fill="#22d3ee" font-size="9" font-weight="600">Phase 2 — Start provider OAuth (PKCE)</text>

        <rect x="20" y="466" width="1280" height="244" rx="8" fill="rgba(251, 113, 133, 0.05)" stroke="#fb7185" stroke-width="1" stroke-dasharray="3,4"/>
        <rect x="28" y="472" width="276" height="15" rx="3" fill="rgba(15, 23, 42, 0.92)" stroke="rgba(251,113,133,0.6)" stroke-width="1"/>
        <text x="36" y="483" fill="#fb7185" font-size="9" font-weight="600">Phase 3 — Consent, callback &amp; token exchange</text>

        <rect x="20" y="718" width="1280" height="222" rx="8" fill="rgba(52, 211, 153, 0.05)" stroke="#34d399" stroke-width="1" stroke-dasharray="3,4"/>
        <rect x="28" y="724" width="300" height="15" rx="3" fill="rgba(15, 23, 42, 0.92)" stroke="rgba(52,211,153,0.6)" stroke-width="1"/>
        <text x="36" y="735" fill="#34d399" font-size="9" font-weight="600">Phase 4 — Inference using the authenticated profile</text>

        <!-- LANE HEADERS -->
        <rect x="40" y="108" width="150" height="46" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
        <text x="115" y="130" fill="white" font-size="11" font-weight="700" text-anchor="middle">Desktop App</text>
        <text x="115" y="145" fill="#22d3ee" font-size="8" text-anchor="middle">Electron main</text>

        <rect x="300" y="108" width="150" height="46" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="375" y="130" fill="white" font-size="11" font-weight="700" text-anchor="middle">Server</text>
        <text x="375" y="145" fill="#34d399" font-size="8" text-anchor="middle">aigw-* backend / callback</text>

        <rect x="565" y="108" width="150" height="46" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="640" y="130" fill="white" font-size="11" font-weight="700" text-anchor="middle">AIGateway</text>
        <text x="640" y="145" fill="#fbbf24" font-size="8" text-anchor="middle">:9105 · LiteLLM</text>

        <rect x="835" y="108" width="130" height="46" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="900" y="130" fill="white" font-size="11" font-weight="700" text-anchor="middle">Browser</text>
        <text x="900" y="145" fill="#94a3b8" font-size="8" text-anchor="middle">user agent</text>

        <rect x="1095" y="108" width="170" height="46" rx="6" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/>
        <text x="1180" y="130" fill="white" font-size="11" font-weight="700" text-anchor="middle">Provider IdP</text>
        <text x="1180" y="145" fill="#fb7185" font-size="8" text-anchor="middle">Anthropic / OpenAI / Google</text>

        <!-- LIFELINES -->
        <line x1="115" y1="154" x2="115" y2="945" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3,5" opacity="0.5"/>
        <line x1="375" y1="154" x2="375" y2="945" stroke="#34d399" stroke-width="1" stroke-dasharray="3,5" opacity="0.5"/>
        <line x1="640" y1="154" x2="640" y2="945" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,5" opacity="0.5"/>
        <line x1="900" y1="154" x2="900" y2="945" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,5" opacity="0.5"/>
        <line x1="1180" y1="154" x2="1180" y2="945" stroke="#fb7185" stroke-width="1" stroke-dasharray="3,5" opacity="0.5"/>

        <!-- credential_blobs store at bottom of AIGateway lane -->
        <line x1="640" y1="945" x2="640" y2="958" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3,3"/>
        <rect x="520" y="958" width="240" height="58" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="640" y="979" fill="white" font-size="10" font-weight="600" text-anchor="middle">credential_blobs (Tortoise)</text>
        <text x="640" y="994" fill="#94a3b8" font-size="8" text-anchor="middle">SQLite local · Postgres hosted</text>
        <text x="640" y="1008" fill="#fb7185" font-size="8" text-anchor="middle">tokens + JWT secret · NO OS keychain</text>

        <!-- ============ PHASE 1 ============ -->
        <!-- 1 D->S -->
        <line x1="115" y1="208" x2="373" y2="208" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#ah-cyan)"/>
        <text x="239" y="204" fill="#94a3b8" font-size="8" text-anchor="middle">① loginGateway(user, password)</text>
        <!-- 2 S->G -->
        <line x1="375" y1="236" x2="638" y2="236" stroke="#34d399" stroke-width="1.5" marker-end="url(#ah-emerald)"/>
        <text x="505" y="232" fill="#94a3b8" font-size="8" text-anchor="middle">② POST /v1/auth/login</text>
        <!-- 3 G self -->
        <path d="M 640 250 h 40 v 16 h -40" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ah-amber)"/>
        <text x="826" y="261" fill="#fbbf24" font-size="8" text-anchor="middle">③ validate vs accounts table · sign JWT (jwt-secret)</text>
        <!-- 4 G->D return -->
        <line x1="638" y1="288" x2="117" y2="288" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#ah-amber)"/>
        <text x="378" y="284" fill="#fbbf24" font-size="8" text-anchor="middle">④ JWT session token (stored by Desktop)</text>

        <!-- ============ PHASE 2 ============ -->
        <!-- 5 D->S -->
        <line x1="115" y1="350" x2="373" y2="350" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#ah-cyan)"/>
        <text x="243" y="346" fill="#94a3b8" font-size="8" text-anchor="middle">⑤ authenticateOAuth(provider)</text>
        <!-- 6 S->G -->
        <line x1="375" y1="378" x2="638" y2="378" stroke="#34d399" stroke-width="1.5" marker-end="url(#ah-emerald)"/>
        <text x="507" y="374" fill="#94a3b8" font-size="8" text-anchor="middle">⑥ POST /v1/auth/{provider}/profiles · Bearer JWT</text>
        <!-- 7 G self multiline -->
        <path d="M 640 392 h 40 v 30 h -40" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ah-amber)"/>
        <text x="846" y="403" fill="#fbbf24" font-size="8" text-anchor="middle">⑦ gen PKCE (verifier+challenge) + state nonce</text>
        <text x="846" y="416" fill="#fbbf24" font-size="8" text-anchor="middle">store PendingAuth (600s TTL) · profile = PENDING</text>
        <!-- 8 G->D return authorize_url -->
        <line x1="638" y1="438" x2="117" y2="438" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#ah-amber)"/>
        <text x="379" y="434" fill="#fbbf24" font-size="8" text-anchor="middle">⑧ authorize_url</text>

        <!-- ============ PHASE 3 ============ -->
        <!-- 9 D->B open browser (long) -->
        <line x1="115" y1="508" x2="898" y2="508" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#ah-cyan)"/>
        <text x="510" y="504" fill="#22d3ee" font-size="8" text-anchor="middle">⑨ main opens browser → authorize_url</text>
        <!-- 10 B->P -->
        <line x1="900" y1="544" x2="1178" y2="544" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah)"/>
        <text x="1041" y="540" fill="#94a3b8" font-size="8" text-anchor="middle">⑩ user login + grant scopes (PKCE)</text>
        <!-- 11 P->G redirect callback (P->B->G). Draw P->B then B->G -->
        <line x1="1178" y1="580" x2="902" y2="580" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#ah-rose)"/>
        <line x1="900" y1="608" x2="642" y2="608" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#ah-rose)"/>
        <text x="830" y="576" fill="#fb7185" font-size="8" text-anchor="middle">⑪ 302 redirect → /callback?code&amp;state  (loopback or hosted)</text>
        <text x="808" y="604" fill="#fb7185" font-size="8" text-anchor="middle">  (externally-hosted gateway → Server /aigw/callback)</text>
        <!-- 12 G->P token exchange -->
        <line x1="640" y1="638" x2="1178" y2="638" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#ah-rose)"/>
        <text x="890" y="634" fill="#fb7185" font-size="8" text-anchor="middle">⑫ lookup state → POST token endpoint: code + code_verifier</text>
        <!-- 13 P->G tokens -->
        <line x1="1178" y1="666" x2="642" y2="666" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#ah-rose)"/>
        <text x="885" y="662" fill="#fb7185" font-size="8" text-anchor="middle">⑬ access_token + refresh_token + expires_in (+ id_token)</text>
        <!-- 14 G persist + return -->
        <path d="M 640 680 h 40 v 16 h -40" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#ah)"/>
        <text x="855" y="691" fill="#a78bfa" font-size="8" text-anchor="middle">⑭ persist → credential_blobs · profile = AUTHENTICATED</text>

        <!-- ============ PHASE 4 ============ -->
        <!-- 15 D->S run locally -->
        <line x1="115" y1="760" x2="373" y2="760" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#ah-cyan)"/>
        <text x="248" y="756" fill="#94a3b8" font-size="8" text-anchor="middle">⑮ Run Locally → GET /ensemble</text>
        <!-- 16 S->G chat -->
        <line x1="375" y1="788" x2="638" y2="788" stroke="#34d399" stroke-width="1.5" marker-end="url(#ah-emerald)"/>
        <text x="508" y="784" fill="#94a3b8" font-size="8" text-anchor="middle">⑯ POST /v1/chat/completions · JWT + X-Profile</text>
        <!-- 17 G self refresh -->
        <path d="M 640 802 h 40 v 30 h -40" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ah-amber)"/>
        <text x="844" y="813" fill="#fbbf24" font-size="8" text-anchor="middle">⑰ load creds from credential_blobs</text>
        <text x="844" y="826" fill="#fbbf24" font-size="8" text-anchor="middle">refresh if expired · inject Authorization header</text>
        <!-- 18 G->P upstream -->
        <line x1="640" y1="852" x2="1178" y2="852" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ah-amber)"/>
        <text x="890" y="848" fill="#fbbf24" font-size="8" text-anchor="middle">⑱ LiteLLM router → upstream model</text>
        <!-- 19 P->D return -->
        <line x1="1178" y1="892" x2="117" y2="892" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#ah-emerald)"/>
        <text x="590" y="888" fill="#34d399" font-size="8" text-anchor="middle">⑲ response → Server → Desktop · eval-runs records accuracy</text>
      <text x="20" y="1112" fill="white" font-size="13" font-weight="700">Notes</text>
<rect x="20.0" y="1126" width="308.0" height="150" rx="10" fill="rgba(15,23,42,0.5)" stroke="#1e293b" stroke-width="1"/>
<circle cx="38.0" cy="1146" r="4.5" fill="#a78bfa"/>
<text x="50.0" y="1150" fill="white" font-size="12" font-weight="600">Two auth layers</text>
<text x="34.0" y="1168" fill="#94a3b8" font-size="9">• Gateway JWT — protects AIGateway itself (login -&gt;</text>
<text x="34.0" y="1182" fill="#94a3b8" font-size="9">  token)</text>
<text x="34.0" y="1200" fill="#94a3b8" font-size="9">• Provider OAuth — per-provider identity</text>
<text x="34.0" y="1214" fill="#94a3b8" font-size="9">  (Anthropic/OpenAI)</text>
<text x="34.0" y="1232" fill="#94a3b8" font-size="9">• JWT signing secret also lives in credential_blobs</text>
<text x="34.0" y="1250" fill="#94a3b8" font-size="9">• Local-only mode can bypass JWT (anonymous account)</text>
<rect x="344.0" y="1126" width="308.0" height="150" rx="10" fill="rgba(15,23,42,0.5)" stroke="#1e293b" stroke-width="1"/>
<circle cx="362.0" cy="1146" r="4.5" fill="#fb7185"/>
<text x="374.0" y="1150" fill="white" font-size="12" font-weight="600">PKCE + state</text>
<text x="358.0" y="1168" fill="#94a3b8" font-size="9">• code_verifier/challenge generated per authorize</text>
<text x="358.0" y="1182" fill="#94a3b8" font-size="9">  request</text>
<text x="358.0" y="1200" fill="#94a3b8" font-size="9">• state nonce keys an in-memory PendingAuth (600s TTL)</text>
<text x="358.0" y="1218" fill="#94a3b8" font-size="9">• Callback (loopback or hosted) matches state, exchanges</text>
<text x="358.0" y="1232" fill="#94a3b8" font-size="9">  code</text>
<text x="358.0" y="1250" fill="#94a3b8" font-size="9">• Server /aigw/callback handles externally-hosted</text>
<text x="358.0" y="1264" fill="#94a3b8" font-size="9">  gateways</text>
<rect x="668.0" y="1126" width="308.0" height="150" rx="10" fill="rgba(15,23,42,0.5)" stroke="#1e293b" stroke-width="1"/>
<circle cx="686.0" cy="1146" r="4.5" fill="#fbbf24"/>
<text x="698.0" y="1150" fill="white" font-size="12" font-weight="600">Profiles vs connections</text>
<text x="682.0" y="1168" fill="#94a3b8" font-size="9">• Profile = named per-user/per-provider identity +</text>
<text x="682.0" y="1182" fill="#94a3b8" font-size="9">  defaults</text>
<text x="682.0" y="1200" fill="#94a3b8" font-size="9">• Connection = labeled multi-account model (DB row)</text>
<text x="682.0" y="1218" fill="#94a3b8" font-size="9">• X-Profile header selects which identity to use</text>
<text x="682.0" y="1236" fill="#94a3b8" font-size="9">• Tokens auto-refresh on expiry before each call</text>
<rect x="992.0" y="1126" width="308.0" height="150" rx="10" fill="rgba(15,23,42,0.5)" stroke="#1e293b" stroke-width="1"/>
<circle cx="1010.0" cy="1146" r="4.5" fill="#34d399"/>
<text x="1022.0" y="1150" fill="white" font-size="12" font-weight="600">Credential storage</text>
<text x="1006.0" y="1168" fill="#94a3b8" font-size="9">• ORMStore -&gt; Tortoise credential_blobs (service,</text>
<text x="1006.0" y="1182" fill="#94a3b8" font-size="9">  account)</text>
<text x="1006.0" y="1200" fill="#94a3b8" font-size="9">• SQLite locally, Postgres hosted/prod</text>
<text x="1006.0" y="1218" fill="#94a3b8" font-size="9">• No OS keychain / libsecret / Credential Manager</text>
<text x="1006.0" y="1236" fill="#94a3b8" font-size="9">• Envelope encryption planned (SF-221 SecretStoreMixin)</text>
</svg>