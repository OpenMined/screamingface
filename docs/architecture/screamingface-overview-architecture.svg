<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 942" width="1300" height="942"><style>text{font-family:"JetBrains Mono","DejaVu Sans Mono",monospace;paint-order:stroke fill;stroke:rgba(2,6,23,0.75);stroke-width:1;stroke-linejoin:round;stroke-linecap:round;}</style><rect width="100%" height="100%" fill="#020617"/>
        <defs>
          <marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b" /></marker>
          <marker id="ah-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24" /></marker>
          <marker id="ah-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399" /></marker>
          <marker id="ah-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee" /></marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- LEGEND (top-left) -->
        <text x="34" y="80" fill="white" font-size="10" font-weight="600">Legend</text>
        <rect x="34" y="90" width="16" height="10" rx="2" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/><text x="56" y="98" fill="#94a3b8" font-size="8">Desktop / UI</text>
        <rect x="34" y="106" width="16" height="10" rx="2" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1"/><text x="56" y="114" fill="#94a3b8" font-size="8">Backend service</text>
        <rect x="34" y="122" width="16" height="10" rx="2" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1"/><text x="56" y="130" fill="#94a3b8" font-size="8">Gateway / cloud edge</text>
        <rect x="34" y="138" width="16" height="10" rx="2" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1"/><text x="56" y="146" fill="#94a3b8" font-size="8">Datastore</text>
        <rect x="34" y="154" width="16" height="10" rx="2" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1"/><text x="56" y="162" fill="#94a3b8" font-size="8">External provider</text>

        <!-- USER -->
        <rect x="30" y="320" width="115" height="64" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="87" y="346" fill="white" font-size="11" font-weight="600" text-anchor="middle">Developer</text>
        <text x="87" y="362" fill="#94a3b8" font-size="8" text-anchor="middle">uses app + CLIs</text>

        <!-- CODING CLIs -->
        <rect x="30" y="430" width="115" height="120" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="87" y="453" fill="white" font-size="11" font-weight="600" text-anchor="middle">Coding CLIs</text>
        <text x="87" y="476" fill="#94a3b8" font-size="9" text-anchor="middle">Claude Code</text>
        <text x="87" y="492" fill="#94a3b8" font-size="9" text-anchor="middle">Codex</text>
        <text x="87" y="508" fill="#94a3b8" font-size="9" text-anchor="middle">Gemini CLI</text>
        <text x="87" y="530" fill="#94a3b8" font-size="8" text-anchor="middle">traffic intercepted</text>

        <!-- LOCAL MACHINE BOUNDARY -->
        <rect x="175" y="55" width="625" height="650" rx="12" fill="rgba(251, 191, 36, 0.04)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
        <rect x="188" y="62" width="290" height="16" rx="3" fill="rgba(15, 23, 42, 0.92)" stroke="rgba(148, 163, 184, 0.5)" stroke-width="1"/>
        <text x="195" y="74" fill="#fbbf24" font-size="10" font-weight="600">Local Machine — localhost (user install)</text>

        <!-- DESKTOP APP -->
        <rect x="205" y="105" width="255" height="185" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
        <text x="332" y="128" fill="white" font-size="13" font-weight="700" text-anchor="middle">Desktop App</text>
        <text x="332" y="145" fill="#22d3ee" font-size="9" text-anchor="middle">Electron · React · Tailwind</text>
        <text x="220" y="170" fill="#94a3b8" font-size="9">Main: spawns server / venv / sessions</text>
        <text x="220" y="187" fill="#94a3b8" font-size="9">Renderer: Settings · Spend</text>
        <text x="220" y="201" fill="#94a3b8" font-size="9">  Eval Studio · Cache/Log</text>
        <text x="220" y="218" fill="#94a3b8" font-size="9">Run Locally → fires /ensemble</text>
        <text x="220" y="235" fill="#94a3b8" font-size="9">IPC bridge (contextIsolation)</text>
        <text x="220" y="259" fill="#22d3ee" font-size="8">app id: ai.screamingface.desktop</text>
        <text x="220" y="274" fill="#22d3ee" font-size="8">bundles Python + uv + server src</text>

        <!-- SERVER -->
        <rect x="205" y="345" width="255" height="345" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="332" y="368" fill="white" font-size="13" font-weight="700" text-anchor="middle">Server</text>
        <text x="332" y="384" fill="#34d399" font-size="9" text-anchor="middle">FastAPI :8000 · uv · sf CLI</text>
        <text x="220" y="408" fill="#94a3b8" font-size="9">Plugin host — Ports &amp; Adapters</text>
        <text x="220" y="425" fill="#94a3b8" font-size="9">core: registry · hooks · routes</text>
        <text x="220" y="442" fill="#94a3b8" font-size="9">url4-executor → /ensemble</text>
        <text x="232" y="456" fill="#94a3b8" font-size="8">fan-out + reduce ensemble</text>
        <text x="220" y="474" fill="#94a3b8" font-size="9">eval-runs → /eval_runs</text>
        <text x="220" y="491" fill="#94a3b8" font-size="9">backends: /claude /codex</text>
        <text x="232" y="505" fill="#94a3b8" font-size="8">/gemini /ollama /python</text>
        <text x="220" y="523" fill="#94a3b8" font-size="9">frontends: proxy :9101–9103</text>
        <text x="232" y="537" fill="#94a3b8" font-size="8">intercept coding-CLI traffic</text>
        <!-- state db -->
        <rect x="240" y="615" width="185" height="52" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="332" y="636" fill="white" font-size="10" font-weight="600" text-anchor="middle">state.db</text>
        <text x="332" y="651" fill="#94a3b8" font-size="8" text-anchor="middle">SQLite · eval runs · blobs</text>

        <!-- AIGATEWAY -->
        <rect x="525" y="345" width="255" height="250" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="652" y="368" fill="white" font-size="13" font-weight="700" text-anchor="middle">AIGateway</text>
        <text x="652" y="384" fill="#fbbf24" font-size="9" text-anchor="middle">LiteLLM proxy :9105</text>
        <text x="540" y="408" fill="#94a3b8" font-size="9">/v1/chat/completions</text>
        <text x="540" y="425" fill="#94a3b8" font-size="9">/v1/auth · OAuth profiles</text>
        <text x="540" y="442" fill="#94a3b8" font-size="9">JWT session auth</text>
        <text x="540" y="459" fill="#94a3b8" font-size="9">router → upstream providers</text>
        <!-- cred db -->
        <rect x="540" y="478" width="225" height="52" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="652" y="499" fill="white" font-size="10" font-weight="600" text-anchor="middle">credential_blobs</text>
        <text x="652" y="514" fill="#94a3b8" font-size="8" text-anchor="middle">Tortoise · SQLite (no OS keychain)</text>
        <text x="652" y="556" fill="#fbbf24" font-size="8" text-anchor="middle">spawned as child of Server</text>
        <text x="652" y="570" fill="#fbbf24" font-size="8" text-anchor="middle">(aigw-runner) or hosted externally</text>

        <!-- CLOUD BOUNDARY -->
        <rect x="840" y="55" width="430" height="300" rx="12" fill="rgba(251, 191, 36, 0.04)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
        <rect x="853" y="62" width="215" height="16" rx="3" fill="rgba(15, 23, 42, 0.92)" stroke="rgba(148, 163, 184, 0.5)" stroke-width="1"/>
        <text x="860" y="74" fill="#fbbf24" font-size="10" font-weight="600">Cloud — Enclave (hosted)</text>

        <!-- SCOREBOARD -->
        <rect x="875" y="108" width="230" height="112" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="990" y="131" fill="white" font-size="12" font-weight="700" text-anchor="middle">Scoreboard</text>
        <text x="990" y="147" fill="#34d399" font-size="9" text-anchor="middle">FastAPI :9106 (public)</text>
        <text x="890" y="170" fill="#94a3b8" font-size="9">POST /v1/scores (submit)</text>
        <text x="890" y="187" fill="#94a3b8" font-size="9">GET /v1/leaderboard/{bench}</text>
        <text x="890" y="204" fill="#94a3b8" font-size="9">ranks best accuracy per spec</text>
        <!-- scoreboard db -->
        <rect x="875" y="248" width="230" height="56" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="990" y="270" fill="white" font-size="10" font-weight="600" text-anchor="middle">PostgreSQL</text>
        <text x="990" y="286" fill="#94a3b8" font-size="8" text-anchor="middle">scores · benchmarks · idempotency</text>

        <!-- PROVIDERS BOUNDARY -->
        <rect x="840" y="400" width="430" height="305" rx="12" fill="rgba(30, 41, 59, 0.25)" stroke="#94a3b8" stroke-width="1" stroke-dasharray="8,4"/>
        <rect x="853" y="407" width="180" height="16" rx="3" fill="rgba(15, 23, 42, 0.92)" stroke="rgba(148, 163, 184, 0.5)" stroke-width="1"/>
        <text x="860" y="419" fill="#94a3b8" font-size="10" font-weight="600">Model Providers</text>
        <rect x="875" y="450" width="170" height="50" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="960" y="480" fill="white" font-size="11" font-weight="600" text-anchor="middle">Anthropic API</text>
        <rect x="875" y="520" width="170" height="50" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="960" y="550" fill="white" font-size="11" font-weight="600" text-anchor="middle">OpenAI / Codex</text>
        <rect x="1070" y="450" width="170" height="50" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="1155" y="480" fill="white" font-size="11" font-weight="600" text-anchor="middle">Google Gemini</text>
        <rect x="1070" y="520" width="170" height="50" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="1155" y="545" fill="white" font-size="11" font-weight="600" text-anchor="middle">Ollama</text>
        <text x="1155" y="560" fill="#94a3b8" font-size="8" text-anchor="middle">localhost :11434</text>

        <!-- ARROWS -->
        <!-- User -> Desktop -->
        <line x1="145" y1="345" x2="203" y2="215" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#ah-cyan)"/>
        <text x="171" y="281" fill="#94a3b8" font-size="8" text-anchor="middle">uses UI</text>

        <!-- CLIs -> Server (intercept) -->
        <line x1="145" y1="495" x2="203" y2="510" stroke="#34d399" stroke-width="1.5" marker-end="url(#ah-emerald)"/>
        <text x="179" y="569" fill="#94a3b8" font-size="8" text-anchor="middle">intercepted → proxy</text>

        <!-- Desktop -> Server: spawn -->
        <line x1="290" y1="290" x2="290" y2="343" stroke="#34d399" stroke-width="2.5" marker-end="url(#ah-emerald)"/>
        <text x="289" y="321" fill="#34d399" font-size="8" text-anchor="middle">spawns (sf run)</text>
        <!-- Desktop -> Server: http -->
        <line x1="405" y1="290" x2="405" y2="343" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#ah-cyan)"/>
        <text x="406" y="321" fill="#94a3b8" font-size="8" text-anchor="middle">/ensemble · /eval_runs</text>

        <!-- Server -> AIGateway -->
        <line x1="460" y1="450" x2="523" y2="450" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ah-amber)"/>
        <text x="494" y="435" fill="#94a3b8" font-size="8" text-anchor="middle">chat via gateway</text>

        <!-- AIGateway -> Providers (egress) -->
        <line x1="780" y1="470" x2="873" y2="490" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#ah-amber)"/>
        <text x="834" y="458" fill="#fbbf24" font-size="8" text-anchor="middle">upstream + token</text>

        <!-- Server frontend proxy -> Providers (CLI traffic, long leader) -->
        <path d="M 460 560 L 490 560 Q 505 560 505 590 L 505 678 Q 505 690 520 690 L 1040 690 Q 1055 690 1055 678 L 1055 575" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#ah-emerald)"/>
        <text x="760" y="693" fill="#34d399" font-size="8" text-anchor="middle">frontend proxy → upstream (CLI traffic)</text>

        <!-- Server/Desktop -> Scoreboard (top route) -->
        <path d="M 430 105 L 430 86 Q 430 79 445 79 L 975 79 Q 990 79 990 92 L 990 106" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#ah-emerald)"/>
        <text x="710" y="82" fill="#34d399" font-size="8" text-anchor="middle">submit scores + read leaderboard</text>
      <text x="20" y="772" fill="white" font-size="13" font-weight="700">Notes</text>
<rect x="20.0" y="786" width="303.0" height="136" rx="10" fill="rgba(15,23,42,0.5)" stroke="#1e293b" stroke-width="1"/>
<circle cx="38.0" cy="806" r="4.5" fill="#22d3ee"/>
<text x="50.0" y="810" fill="white" font-size="12" font-weight="600">Desktop App</text>
<text x="34.0" y="828" fill="#94a3b8" font-size="9">• Electron control plane the user installs</text>
<text x="34.0" y="846" fill="#94a3b8" font-size="9">• Main process spawns &amp; supervises the local Server</text>
<text x="34.0" y="864" fill="#94a3b8" font-size="9">• 4 screens: Settings, Spend, Eval Studio, Cache/Log</text>
<text x="34.0" y="882" fill="#94a3b8" font-size="9">• "Run Locally" fires an ensemble + polls eval runs</text>
<rect x="339.0" y="786" width="303.0" height="136" rx="10" fill="rgba(15,23,42,0.5)" stroke="#1e293b" stroke-width="1"/>
<circle cx="357.0" cy="806" r="4.5" fill="#34d399"/>
<text x="369.0" y="810" fill="white" font-size="12" font-weight="600">Server</text>
<text x="353.0" y="828" fill="#94a3b8" font-size="9">• FastAPI plugin host (Ports &amp; Adapters)</text>
<text x="353.0" y="846" fill="#94a3b8" font-size="9">• url4-executor runs the fan-out + reduce ensemble</text>
<text x="353.0" y="864" fill="#94a3b8" font-size="9">• Frontend plugins proxy coding-CLI traffic</text>
<text x="353.0" y="882" fill="#94a3b8" font-size="9">• Backend plugins call models directly or via gateway</text>
<rect x="658.0" y="786" width="303.0" height="136" rx="10" fill="rgba(15,23,42,0.5)" stroke="#1e293b" stroke-width="1"/>
<circle cx="676.0" cy="806" r="4.5" fill="#fbbf24"/>
<text x="688.0" y="810" fill="white" font-size="12" font-weight="600">AIGateway</text>
<text x="672.0" y="828" fill="#94a3b8" font-size="9">• LiteLLM proxy in front of all providers</text>
<text x="672.0" y="846" fill="#94a3b8" font-size="9">• Owns OAuth profiles + JWT session auth</text>
<text x="672.0" y="864" fill="#94a3b8" font-size="9">• Credentials in Tortoise credential_blobs (no</text>
<text x="672.0" y="878" fill="#94a3b8" font-size="9">  keychain)</text>
<text x="672.0" y="896" fill="#94a3b8" font-size="9">• Runs as a child of the Server or hosted in the</text>
<text x="672.0" y="910" fill="#94a3b8" font-size="9">  Enclave</text>
<rect x="977.0" y="786" width="303.0" height="136" rx="10" fill="rgba(15,23,42,0.5)" stroke="#1e293b" stroke-width="1"/>
<circle cx="995.0" cy="806" r="4.5" fill="#34d399"/>
<text x="1007.0" y="810" fill="white" font-size="12" font-weight="600">Scoreboard</text>
<text x="991.0" y="828" fill="#94a3b8" font-size="9">• Public cloud leaderboard service (FastAPI :9106)</text>
<text x="991.0" y="846" fill="#94a3b8" font-size="9">• Clients POST eval results to /v1/scores</text>
<text x="991.0" y="864" fill="#94a3b8" font-size="9">• Ranks best accuracy per spec vs SOTA</text>
<text x="991.0" y="882" fill="#94a3b8" font-size="9">• PostgreSQL; verified_by_openmined trust flag</text>
</svg>