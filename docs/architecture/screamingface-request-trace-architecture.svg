<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1490 520" width="1490" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', ui-monospace, monospace">
  <style>
    text { paint-order: stroke fill; stroke: #020617; stroke-width: 4px; stroke-linejoin: round; stroke-linecap: round; }
    text.title { stroke-width: 6px; }
    text.sub { stroke-width: 3px; }
  </style>
  <defs>
    <marker id="ah-emerald" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,5 L0,10" fill="none" stroke="#34d399" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ah-cyan" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,5 L0,10" fill="none" stroke="#22d3ee" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ah-slate" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,5 L0,10" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ah-violet" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,5 L0,10" fill="none" stroke="#a78bfa" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ah-rose" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,5 L0,10" fill="none" stroke="#fb7185" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,5 L0,10" fill="none" stroke="#fbbf24" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#020617"/>
  <rect width="100%" height="100%" fill="url(#grid2)"/>

  <!-- Title -->
  <text class="title" x="24" y="36" fill="white" font-size="16" font-weight="700">ScreamingFace — request lifecycle</text>
  <text class="sub" x="24" y="56" fill="#94a3b8" font-size="10">one coding-CLI prompt through the stack</text>

  <!-- Backend plugins cluster -->
  <rect x="970" y="76" width="230" height="260" rx="4" fill="rgba(251,113,133,0.04)" stroke="#fb7185" stroke-width="1" stroke-dasharray="8,4"/>
  <text class="sub" x="978" y="94" fill="#fb7185" font-size="9" font-weight="600">backend plugins — one /path owner</text>

  <!-- Coding CLI -->
  <rect x="40" y="208" width="140" height="52" rx="2" fill="#0f172a"/>
  <rect class="component slate" x="40" y="208" width="140" height="52" rx="2" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="110" y="230" fill="white" font-size="12" font-weight="600" text-anchor="middle">coding CLI</text>
  <text class="sub" x="110" y="248" fill="#94a3b8" font-size="9" text-anchor="middle">Claude Code</text>

  <!-- Interceptor -->
  <rect x="250" y="200" width="150" height="68" rx="2" fill="#0f172a"/>
  <rect class="component rose" x="250" y="200" width="150" height="68" rx="2" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="325" y="222" fill="white" font-size="12" font-weight="600" text-anchor="middle">interceptor</text>
  <text class="sub" x="325" y="240" fill="#94a3b8" font-size="9" text-anchor="middle">claude·env·mitmproxy</text>
  <text class="sub" x="325" y="256" fill="#94a3b8" font-size="9" text-anchor="middle">one active (mutex)</text>

  <!-- Frontend proxy -->
  <rect x="470" y="200" width="150" height="68" rx="2" fill="#0f172a"/>
  <rect class="component cyan" x="470" y="200" width="150" height="68" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="545" y="222" fill="white" font-size="12" font-weight="600" text-anchor="middle">*-frontend :9101</text>
  <text class="sub" x="545" y="240" fill="#94a3b8" font-size="9" text-anchor="middle">transparent proxy</text>
  <text class="sub" x="545" y="256" fill="#94a3b8" font-size="9" text-anchor="middle">redaction + tracing</text>

  <!-- url4-executor -->
  <rect x="720" y="200" width="160" height="68" rx="2" fill="#0f172a"/>
  <rect class="component emerald" x="720" y="200" width="160" height="68" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="800" y="222" fill="white" font-size="12" font-weight="600" text-anchor="middle">url4-executor</text>
  <text class="sub" x="800" y="240" fill="#94a3b8" font-size="9" text-anchor="middle">GET /ensemble</text>
  <text class="sub" x="800" y="256" fill="#94a3b8" font-size="9" text-anchor="middle">parse → fan-out → reduce</text>

  <!-- Direct API backend -->
  <rect x="990" y="120" width="190" height="68" rx="2" fill="#0f172a"/>
  <rect class="component emerald" x="990" y="120" width="190" height="68" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="1085" y="142" fill="white" font-size="12" font-weight="600" text-anchor="middle">*-backend-api</text>
  <text class="sub" x="1085" y="160" fill="#94a3b8" font-size="9" text-anchor="middle">/claude /codex /gemini /ollama</text>
  <text class="sub" x="1085" y="176" fill="#94a3b8" font-size="9" text-anchor="middle">OAuth from local CLI creds</text>

  <!-- AIGateway backend -->
  <rect x="990" y="248" width="190" height="68" rx="2" fill="#0f172a"/>
  <rect class="component amber" x="990" y="248" width="190" height="68" rx="2" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="1085" y="270" fill="white" font-size="12" font-weight="600" text-anchor="middle">aigw-*-backend</text>
  <text class="sub" x="1085" y="288" fill="#94a3b8" font-size="9" text-anchor="middle">→ AIGateway :9105</text>
  <text class="sub" x="1085" y="304" fill="#94a3b8" font-size="9" text-anchor="middle">LiteLLM · credential_blobs</text>

  <!-- Providers -->
  <rect x="1290" y="200" width="160" height="68" rx="2" fill="#0f172a"/>
  <rect class="component slate" x="1290" y="200" width="160" height="68" rx="2" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1370" y="222" fill="white" font-size="12" font-weight="600" text-anchor="middle">upstream providers</text>
  <text class="sub" x="1370" y="240" fill="#94a3b8" font-size="9" text-anchor="middle">Anthropic · OpenAI</text>
  <text class="sub" x="1370" y="256" fill="#94a3b8" font-size="9" text-anchor="middle">Google · Ollama</text>

  <!-- eval-runs -->
  <rect x="735" y="380" width="130" height="52" rx="2" fill="#0f172a"/>
  <rect class="component violet" x="735" y="380" width="130" height="52" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="800" y="402" fill="white" font-size="12" font-weight="600" text-anchor="middle">eval-runs</text>
  <text class="sub" x="800" y="420" fill="#94a3b8" font-size="9" text-anchor="middle">persists the run</text>

  <!-- Desktop -->
  <rect x="990" y="380" width="140" height="52" rx="2" fill="#0f172a"/>
  <rect class="component cyan" x="990" y="380" width="140" height="52" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="1060" y="402" fill="white" font-size="12" font-weight="600" text-anchor="middle">apps/desktop</text>
  <text class="sub" x="1060" y="420" fill="#94a3b8" font-size="9" text-anchor="middle">RunView · Eval Studio</text>

  <!-- Edges: forward path -->
  <path d="M180 234 H250" fill="none" stroke="#fb7185" stroke-width="1" marker-end="url(#ah-rose)"/>
  <text class="sub" x="215" y="228" fill="#94a3b8" font-size="9" text-anchor="middle">1</text>

  <path d="M400 234 H470" fill="none" stroke="#22d3ee" stroke-width="1" marker-end="url(#ah-cyan)"/>
  <text class="sub" x="435" y="228" fill="#94a3b8" font-size="9" text-anchor="middle">2</text>

  <path d="M620 234 H720" fill="none" stroke="#34d399" stroke-width="1" marker-end="url(#ah-emerald)"/>
  <text class="sub" x="670" y="228" fill="#94a3b8" font-size="9" text-anchor="middle">3 · /ensemble</text>

  <path d="M880 223 H923 Q935 223 935 211 V166 Q935 154 947 154 H990" fill="none" stroke="#34d399" stroke-width="1" marker-end="url(#ah-emerald)"/>
  <text class="sub" x="923" y="190" fill="#94a3b8" font-size="9" text-anchor="end">4 · fan-out</text>
  <path d="M880 245 H923 Q935 245 935 257 V270 Q935 282 947 282 H990" fill="none" stroke="#fbbf24" stroke-width="1" marker-end="url(#ah-amber)"/>

  <path d="M1180 154 H1223 Q1235 154 1235 166 V211 Q1235 223 1247 223 H1290" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,3" marker-end="url(#ah-slate)"/>
  <text class="sub" x="1262" y="217" fill="#94a3b8" font-size="9" text-anchor="middle">5</text>
  <path d="M1180 282 H1223 Q1235 282 1235 270 V257 Q1235 245 1247 245 H1290" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,3" marker-end="url(#ah-slate)"/>
  <text class="sub" x="1262" y="239" fill="#94a3b8" font-size="9" text-anchor="middle">5</text>

  <!-- Edges: return paths (top corridors) -->
  <path d="M1370 200 V72 Q1370 60 1358 60 H839 Q827 60 827 72 V200" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,3" marker-end="url(#ah-slate)"/>
  <text class="sub" x="1100" y="56" fill="#94a3b8" font-size="9" text-anchor="middle">6 · responses</text>

  <path d="M773 200 V92 Q773 80 761 80 H122 Q110 80 110 92 V208" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="2,3" marker-end="url(#ah-cyan)"/>
  <text class="sub" x="440" y="76" fill="#94a3b8" font-size="9" text-anchor="middle">7 · response → frontend → CLI</text>

  <!-- Edges: persistence + UI -->
  <path d="M800 268 V380" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ah-violet)"/>
  <text class="sub" x="812" y="330" fill="#a78bfa" font-size="9">records</text>

  <path d="M865 406 H990" fill="none" stroke="#22d3ee" stroke-width="1" marker-end="url(#ah-cyan)"/>
  <text class="sub" x="927" y="400" fill="#94a3b8" font-size="9" text-anchor="middle">poll /eval_runs</text>

  <!-- Mutex relation -->
  <path d="M1085 188 V248" fill="none" stroke="#fb7185" stroke-width="1" stroke-dasharray="3,3"/>
  <text class="sub" x="1097" y="222" fill="#fb7185" font-size="8">conflicts · pick one</text>

  <!-- Legend (bottom left) -->
  <rect x="40" y="452" width="16" height="10" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
  <text class="sub" x="62" y="460" fill="#94a3b8" font-size="8">server plugin</text>
  <rect x="160" y="452" width="16" height="10" rx="2" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1"/>
  <text class="sub" x="182" y="460" fill="#94a3b8" font-size="8">gateway-routed</text>
  <rect x="300" y="452" width="16" height="10" rx="2" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1"/>
  <text class="sub" x="322" y="460" fill="#94a3b8" font-size="8">mutex group</text>
  <rect x="430" y="452" width="16" height="10" rx="2" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1"/>
  <text class="sub" x="452" y="460" fill="#94a3b8" font-size="8">external</text>
  <rect x="540" y="452" width="16" height="10" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1"/>
  <text class="sub" x="562" y="460" fill="#94a3b8" font-size="8">persistence</text>
  <line x1="660" y1="457" x2="676" y2="457" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,3"/>
  <text class="sub" x="682" y="460" fill="#94a3b8" font-size="8">egress / response</text>
</svg>
