<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1540 470" width="1540" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', ui-monospace, monospace">
  <style>
    text { paint-order: stroke fill; stroke: #020617; stroke-width: 4px; stroke-linejoin: round; stroke-linecap: round; }
    text.title { stroke-width: 6px; }
    text.sub { stroke-width: 3px; }
  </style>
  <defs>
    <marker id="ah-emerald" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,5 L0,10" fill="none" stroke="#34d399" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ah-cyan" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,5 L0,10" fill="none" stroke="#22d3ee" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ah-slate" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,5 L0,10" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ah-violet" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,5 L0,10" fill="none" stroke="#a78bfa" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#020617"/>
  <rect width="100%" height="100%" fill="url(#grid1)"/>

  <!-- Title -->
  <text class="title" x="24" y="36" fill="white" font-size="16" font-weight="700">ScreamingFace — URL4 ensemble flow</text>
  <text class="sub" x="24" y="56" fill="#94a3b8" font-size="10">GET /ensemble · parse → resolve context → fan-out → reduce</text>

  <!-- Legend (top right) -->
  <rect x="1130" y="28" width="16" height="10" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
  <text class="sub" x="1152" y="36" fill="#94a3b8" font-size="8">url4 engine</text>
  <rect x="1250" y="28" width="16" height="10" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text class="sub" x="1272" y="36" fill="#94a3b8" font-size="8">caller I/O</text>
  <rect x="1370" y="28" width="16" height="10" rx="2" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1"/>
  <text class="sub" x="1392" y="36" fill="#94a3b8" font-size="8">provider</text>
  <rect x="1130" y="46" width="16" height="10" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1"/>
  <text class="sub" x="1152" y="54" fill="#94a3b8" font-size="8">persistence</text>
  <line x1="1250" y1="51" x2="1266" y2="51" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,3"/>
  <text class="sub" x="1272" y="54" fill="#94a3b8" font-size="8">egress</text>
  <line x1="1370" y1="51" x2="1386" y2="51" stroke="#a78bfa" stroke-width="1" stroke-dasharray="1,3"/>
  <text class="sub" x="1392" y="54" fill="#94a3b8" font-size="8">audit</text>

  <!-- Fan-out cluster -->
  <rect x="700" y="96" width="180" height="252" rx="4" fill="rgba(52,211,153,0.04)" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
  <text class="sub" x="708" y="114" fill="#34d399" font-size="9" font-weight="600">fan-out · by weight</text>
  <text class="sub" x="790" y="366" fill="#64748b" font-size="8" text-anchor="middle">N backend calls in parallel</text>

  <!-- IN -->
  <rect x="40" y="200" width="150" height="68" rx="2" fill="#0f172a"/>
  <rect class="component cyan" x="40" y="200" width="150" height="68" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="115" y="222" fill="white" font-size="12" font-weight="600" text-anchor="middle">GET /ensemble</text>
  <text class="sub" x="115" y="240" fill="#94a3b8" font-size="9" text-anchor="middle">or an active url4 spec</text>
  <text class="sub" x="115" y="256" fill="#94a3b8" font-size="9" text-anchor="middle">from a frontend proxy</text>

  <!-- EnsembleInterpreter -->
  <rect x="250" y="200" width="180" height="68" rx="2" fill="#0f172a"/>
  <rect class="component emerald" x="250" y="200" width="180" height="68" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="340" y="222" fill="white" font-size="12" font-weight="600" text-anchor="middle">EnsembleInterpreter</text>
  <text class="sub" x="340" y="240" fill="#94a3b8" font-size="9" text-anchor="middle">parse() → typed AST</text>
  <text class="sub" x="340" y="256" fill="#94a3b8" font-size="9" text-anchor="middle">Url4BackendCall·Url4Reduce</text>

  <!-- Context resolution -->
  <rect x="490" y="200" width="160" height="68" rx="2" fill="#0f172a"/>
  <rect class="component emerald" x="490" y="200" width="160" height="68" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="570" y="222" fill="white" font-size="12" font-weight="600" text-anchor="middle">context resolution</text>
  <text class="sub" x="570" y="240" fill="#94a3b8" font-size="9" text-anchor="middle">*source · /data KV</text>
  <text class="sub" x="570" y="256" fill="#94a3b8" font-size="9" text-anchor="middle">rel-url ASGI · http GET</text>

  <!-- Backends (inside cluster) -->
  <rect x="720" y="140" width="140" height="36" rx="2" fill="#0f172a"/>
  <rect class="component emerald" x="720" y="140" width="140" height="36" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="790" y="162" fill="white" font-size="12" font-weight="600" text-anchor="middle">/claude backend</text>

  <rect x="720" y="216" width="140" height="36" rx="2" fill="#0f172a"/>
  <rect class="component emerald" x="720" y="216" width="140" height="36" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="790" y="238" fill="white" font-size="12" font-weight="600" text-anchor="middle">/gemini backend</text>

  <rect x="720" y="292" width="140" height="36" rx="2" fill="#0f172a"/>
  <rect class="component emerald" x="720" y="292" width="140" height="36" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="790" y="314" fill="white" font-size="12" font-weight="600" text-anchor="middle">/codex backend</text>

  <!-- Providers -->
  <rect x="940" y="132" width="140" height="52" rx="2" fill="#0f172a"/>
  <rect class="component slate" x="940" y="132" width="140" height="52" rx="2" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1010" y="154" fill="white" font-size="12" font-weight="600" text-anchor="middle">Anthropic</text>
  <text class="sub" x="1010" y="172" fill="#94a3b8" font-size="9" text-anchor="middle">direct api / aigw</text>

  <rect x="940" y="208" width="140" height="52" rx="2" fill="#0f172a"/>
  <rect class="component slate" x="940" y="208" width="140" height="52" rx="2" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1010" y="230" fill="white" font-size="12" font-weight="600" text-anchor="middle">Google</text>
  <text class="sub" x="1010" y="248" fill="#94a3b8" font-size="9" text-anchor="middle">direct api / aigw</text>

  <rect x="940" y="284" width="140" height="52" rx="2" fill="#0f172a"/>
  <rect class="component slate" x="940" y="284" width="140" height="52" rx="2" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1010" y="306" fill="white" font-size="12" font-weight="600" text-anchor="middle">OpenAI</text>
  <text class="sub" x="1010" y="324" fill="#94a3b8" font-size="9" text-anchor="middle">direct api / aigw</text>

  <!-- Reduce -->
  <rect x="1160" y="200" width="150" height="68" rx="2" fill="#0f172a"/>
  <rect class="component emerald" x="1160" y="200" width="150" height="68" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="1235" y="222" fill="white" font-size="12" font-weight="600" text-anchor="middle">reduce</text>
  <text class="sub" x="1235" y="240" fill="#94a3b8" font-size="9" text-anchor="middle">feeds all N responses</text>
  <text class="sub" x="1235" y="256" fill="#94a3b8" font-size="9" text-anchor="middle">into reducer model</text>

  <!-- OUT -->
  <rect x="1370" y="208" width="130" height="52" rx="2" fill="#0f172a"/>
  <rect class="component cyan" x="1370" y="208" width="130" height="52" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="1435" y="230" fill="white" font-size="12" font-weight="600" text-anchor="middle">final answer</text>
  <text class="sub" x="1435" y="248" fill="#94a3b8" font-size="9" text-anchor="middle">→ caller / CLI</text>

  <!-- eval-runs -->
  <rect x="1360" y="340" width="150" height="68" rx="2" fill="#0f172a"/>
  <rect class="component violet" x="1360" y="340" width="150" height="68" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1435" y="362" fill="white" font-size="12" font-weight="600" text-anchor="middle">eval-runs</text>
  <text class="sub" x="1435" y="380" fill="#94a3b8" font-size="9" text-anchor="middle">accuracy per question</text>
  <text class="sub" x="1435" y="396" fill="#94a3b8" font-size="9" text-anchor="middle">X-SF-Run-Id per run</text>

  <!-- Edges -->
  <path d="M190 234 H250" fill="none" stroke="#34d399" stroke-width="1" marker-end="url(#ah-emerald)"/>
  <path d="M430 234 H490" fill="none" stroke="#34d399" stroke-width="1" marker-end="url(#ah-emerald)"/>

  <path d="M650 217 H663 Q675 217 675 205 V170 Q675 158 687 158 H720" fill="none" stroke="#34d399" stroke-width="1" marker-end="url(#ah-emerald)"/>
  <path d="M650 234 H720" fill="none" stroke="#34d399" stroke-width="1" marker-end="url(#ah-emerald)"/>
  <path d="M650 251 H663 Q675 251 675 263 V298 Q675 310 687 310 H720" fill="none" stroke="#34d399" stroke-width="1" marker-end="url(#ah-emerald)"/>

  <path d="M860 158 H940" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,3" marker-end="url(#ah-slate)"/>
  <path d="M860 234 H940" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,3" marker-end="url(#ah-slate)"/>
  <path d="M860 310 H940" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,3" marker-end="url(#ah-slate)"/>

  <path d="M1080 158 H1108 Q1120 158 1120 170 V205 Q1120 217 1132 217 H1160" fill="none" stroke="#34d399" stroke-width="1" marker-end="url(#ah-emerald)"/>
  <path d="M1080 234 H1160" fill="none" stroke="#34d399" stroke-width="1" marker-end="url(#ah-emerald)"/>
  <path d="M1080 310 H1108 Q1120 310 1120 298 V263 Q1120 251 1132 251 H1160" fill="none" stroke="#34d399" stroke-width="1" marker-end="url(#ah-emerald)"/>

  <path d="M1310 234 H1370" fill="none" stroke="#22d3ee" stroke-width="1" marker-end="url(#ah-cyan)"/>

  <path d="M1435 260 V340" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="1,3" marker-end="url(#ah-violet)"/>
  <text class="sub" x="1447" y="304" fill="#a78bfa" font-size="9">scored</text>
</svg>
