<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 780" width="1440" height="780" font-family="JetBrains Mono, Menlo, monospace"><title>Extension load sequence</title><defs><marker id="arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/></marker><marker id="arr-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/></marker><marker id="arr-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/></marker><marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/></marker><marker id="arr-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fb7185"/></marker><marker id="arr-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="1440" height="780" fill="#020617"/><text x="32" y="44" font-size="18" fill="#e2e8f0" text-anchor="start" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">Extension lifecycle — load sequence &amp; no-restart mechanics</text><text x="32" y="66" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">arch-electron doctrine (OME-368) · install/enable changes the app without restart</text><rect x="50" y="130" width="660" height="220" rx="12" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="8,4"/><rect x="68" y="119" width="306.2" height="22" rx="3" fill="rgba(15,23,42,0.95)" stroke="#a78bfa" stroke-width="1"/><text x="76" y="134" font-size="12" fill="#a78bfa" text-anchor="start" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">declarative phase — zero extension code</text><rect x="752" y="130" width="660" height="220" rx="12" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="8,4"/><rect x="770" y="119" width="298.7" height="22" rx="3" fill="rgba(15,23,42,0.95)" stroke="#34d399" stroke-width="1"/><text x="778" y="134" font-size="12" fill="#34d399" text-anchor="start" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">activation phase — lazy, per extension</text><rect x="70" y="180" width="190" height="120" rx="6" fill="rgba(30, 41, 59, 0.65)" stroke="#94a3b8" stroke-width="1.5"/><text x="165.0" y="204" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">1 · SCAN</text><text x="165.0" y="224" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">read manifests from disk</text><text x="165.0" y="240" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">nothing executes</text><line x1="260" y1="240.0" x2="284" y2="240.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr-slate)"/><rect x="284" y="180" width="190" height="120" rx="6" fill="rgba(76, 29, 149, 0.55)" stroke="#a78bfa" stroke-width="1.5"/><text x="379.0" y="204" font-size="12" fill="#a78bfa" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">2 · MERGE</text><text x="379.0" y="224" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">contributions → registries</text><text x="379.0" y="240" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">commands · menus · views</text><line x1="474" y1="240.0" x2="498" y2="240.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr-slate)"/><rect x="498" y="180" width="190" height="120" rx="6" fill="rgba(8, 51, 68, 0.55)" stroke="#22d3ee" stroke-width="1.5"/><text x="593.0" y="204" font-size="12" fill="#22d3ee" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">3 · RENDER</text><text x="593.0" y="224" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">UI reacts to registries</text><text x="593.0" y="240" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">extension visible, 0 code</text><line x1="688" y1="240.0" x2="772" y2="240.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr-slate)"/><rect x="772" y="180" width="190" height="120" rx="6" fill="rgba(120, 53, 15, 0.45)" stroke="#fbbf24" stroke-width="1.5"/><text x="867.0" y="204" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">4 · EVENT</text><text x="867.0" y="224" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">activation event fires</text><text x="867.0" y="240" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">onCommand · onView · startup</text><line x1="962" y1="240.0" x2="986" y2="240.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr-slate)"/><rect x="986" y="180" width="190" height="120" rx="6" fill="rgba(6, 78, 59, 0.55)" stroke="#34d399" stroke-width="1.5"/><text x="1081.0" y="204" font-size="12" fill="#34d399" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">5 · LOAD</text><text x="1081.0" y="224" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">host require()s entry</text><text x="1081.0" y="240" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">injects `api`, engines-gated</text><line x1="1176" y1="240.0" x2="1200" y2="240.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr-slate)"/><rect x="1200" y="180" width="190" height="120" rx="6" fill="rgba(6, 78, 59, 0.55)" stroke="#34d399" stroke-width="1.5"/><text x="1295.0" y="204" font-size="12" fill="#34d399" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">6 · ACTIVATE</text><text x="1295.0" y="224" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">activate(ctx) runs</text><text x="1295.0" y="240" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">registrations → Disposables</text><rect x="130" y="480" width="340" height="130" rx="6" fill="rgba(76, 29, 149, 0.55)" stroke="#a78bfa" stroke-width="1.5"/><text x="300.0" y="504" font-size="13" fill="#a78bfa" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">DISABLE — no restart</text><text x="300.0" y="524" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">deactivate() → dispose bag (X5)</text><text x="300.0" y="540" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">registry entries removed</text><text x="300.0" y="556" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">UI reacts instantly</text><rect x="550" y="480" width="340" height="130" rx="6" fill="rgba(136, 19, 55, 0.55)" stroke="#fb7185" stroke-width="1.5"/><text x="720.0" y="504" font-size="13" fill="#fb7185" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">UNINSTALL / UPDATE</text><text x="720.0" y="524" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">Node can&#x27;t evict loaded modules</text><text x="720.0" y="540" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">refork extension host (X7)</text><text x="720.0" y="556" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">window survives · ext&#x27;ns re-activate</text><rect x="970" y="480" width="340" height="130" rx="6" fill="rgba(120, 53, 15, 0.45)" stroke="#fbbf24" stroke-width="1.5"/><text x="1140.0" y="504" font-size="13" fill="#fbbf24" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">SAFE MODE (X8)</text><text x="1140.0" y="524" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">start with all extensions off</text><text x="1140.0" y="540" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">recovery when startup breaks</text><line x1="1295.0" y1="300" x2="300" y2="480" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arr-violet)"/><line x1="1295.0" y1="300" x2="720" y2="480" stroke="#fb7185" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arr-rose)"/><rect x="768.8" y="380.0" width="57.4" height="20.0" rx="3" fill="rgba(15,23,42,0.92)" stroke="rgba(148,163,184,0.75)" stroke-width="1"/><text x="797.5" y="393.6" font-size="10" fill="#a78bfa" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">disable</text><rect x="944.7" y="380.0" width="125.6" height="20.0" rx="3" fill="rgba(15,23,42,0.92)" stroke="rgba(148,163,184,0.75)" stroke-width="1"/><text x="1007.5" y="393.6" font-size="10" fill="#fb7185" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">uninstall / update</text><rect x="341.0" y="680.0" width="758.0" height="20.0" rx="3" fill="rgba(15,23,42,0.92)" stroke="rgba(148,163,184,0.75)" stroke-width="1"/><text x="720" y="693.6" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">startup MUST NOT scale with installed extensions (X2) · UI presence is manifest-declared, activate() binds behavior (X1)</text></svg>