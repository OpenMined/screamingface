ke="rgba(2,6,23,0.75)" stroke-width="2">STATUS BAR — reserved, hidden in v1</text><text x="648.0" y="602" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">(L9 binds when it ships)</text><rect x="222.8" y="680.5" width="594.3" height="19.0" rx="3" fill="rgba(15,23,42,0.92)" stroke="rgba(148,163,184,0.75)" stroke-width="1"/><text x="520" y="693.24" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">initial layout source: Ensemble Studio design — irinambejan.github.io/model-ensemble-studio (2026-07-09)</text><rect x="1000" y="100" width="410" height="470" rx="12" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="8,4"/><rect x="1018" y="89" width="194.6" height="22" rx="3" fill="rgba(15,23,42,0.95)" stroke="#a78bfa" stroke-width="1"/><text x="1026" y="104" font-size="12" fill="#a78bfa" text-anchor="start" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">view placement lifecycle</text><rect x="1020" y="150" width="370" height="84" rx="6" fill="rgba(30, 41, 59, 0.65)" stroke="#94a3b8" stroke-width="1.5"/><text x="1205.0" y="174" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">extension manifest (L3)</text><text x="1205.0" y="194" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">container + slot HINT</text><text x="1205.0" y="210" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">applies on first run only</text><line x1="1205" y1="234" x2="1205" y2="288" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr-slate)"/><rect x="1020" y="292" width="370" height="96" rx="6" fill="rgba(76, 29, 149, 0.55)" stroke="#a78bfa" stroke-width="1.5"/><text x="1205.0" y="316" font-size="11" fill="#a78bfa" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">core layout tree (L6)</text><text x="1205.0" y="336" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">per-window · core storage (S1)</text><text x="1205.0" y="352" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">restored every start</text><text x="1205.0" y="368" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">extensions: no direct access</text><line x1="1205" y1="388" x2="1205" y2="442" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr-slate)"/><rect x="1020" y="446" width="370" height="84" rx="6" fill="rgba(6, 78, 59, 0.55)" stroke="#34d399" stroke-width="1.5"/><text x="1205.0" y="470" font-size="11" fill="#34d399" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">USER override (L4)</text><text x="1205.0" y="490" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">move · hide · resize · reorder</text><text x="1205.0" y="506" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">persists — beats the hint forever</text><path d="M 1390 470 C 1425 470 1425 330 1390 330" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arr-emerald)"/><rect x="1020" y="610" width="370" height="84" rx="6" fill="rgba(136, 19, 55, 0.55)" stroke="#fb7185" stroke-width="1.5"/><text x="1205.0" y="634" font-size="11" fill="#fb7185" tex