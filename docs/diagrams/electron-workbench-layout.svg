<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 870" width="1440" height="870" font-family="JetBrains Mono, Menlo, monospace"><title>Workbench layout doctrine</title><defs><marker id="arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/></marker><marker id="arr-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/></marker><marker id="arr-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/></marker><marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/></marker><marker id="arr-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fb7185"/></marker><marker id="arr-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="1440" height="870" fill="#020617"/><text x="32" y="44" font-size="18" fill="#e2e8f0" text-anchor="start" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">Workbench layout — core-owned shell &amp; view placement</text><text x="32" y="66" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">arch-electron-layout doctrine (OME-370) · extensions are guests: hint once, user owns the layout</text><rect x="80" y="100" width="880" height="640" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8,4"/><rect x="98" y="89" width="261.5" height="22" rx="3" fill="rgba(15,23,42,0.95)" stroke="#94a3b8" stroke-width="1"/><text x="106" y="104" font-size="12" fill="#94a3b8" text-anchor="start" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">WORKBENCH — core-owned shell (L1)</text><rect x="100" y="130" width="840" height="40" rx="6" fill="rgba(8, 51, 68, 0.55)" stroke="#22d3ee" stroke-width="1.5"/><text x="520.0" y="154" font-size="11" fill="#22d3ee" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">TITLE BAR</text><rect x="100" y="186" width="60" height="460" rx="6" fill="rgba(8, 51, 68, 0.55)" stroke="#22d3ee" stroke-width="1.5"/><text x="130.0" y="210" font-size="11" fill="#22d3ee" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">AB</text><rect x="176" y="186" width="250" height="460" rx="6" fill="rgba(8, 51, 68, 0.55)" stroke="#22d3ee" stroke-width="1.5"/><text x="301.0" y="210" font-size="11" fill="#22d3ee" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">PRIMARY SIDEBAR</text><rect x="192" y="240" width="218" height="92" rx="6" fill="rgba(76, 29, 149, 0.55)" stroke="#a78bfa" stroke-width="1.5"/><text x="301.0" y="264" font-size="11" fill="#a78bfa" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">view container A</text><text x="301.0" y="284" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">ext views land here</text><rect x="192" y="348" width="218" height="92" rx="6" fill="rgba(76, 29, 149, 0.55)" stroke="#a78bfa" stroke-width="1.5"/><text x="301.0" y="372" font-size="11" fill="#a78bfa" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">view container B</text><text x="301.0" y="392" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">core + ext views</text><rect x="213.1" y="470.5" width="175.8" height="19.0" rx="3" fill="rgba(15,23,42,0.92)" stroke="rgba(148,163,184,0.75)" stroke-width="1"/><text x="301" y="483.24" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">slots — hint places once (L3)</text><rect x="442" y="186" width="498" height="300" rx="6" fill="rgba(8, 51, 68, 0.55)" stroke="#22d3ee" stroke-width="1.5"/><text x="691.0" y="210" font-size="12" fill="#22d3ee" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">MAIN AREA — document-centric (L7)</text><text x="691.0" y="230" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">editor / eval-run / document tabs</text><text x="691.0" y="246" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">extensions contribute document types only</text><rect x="442" y="502" width="498" height="144" rx="6" fill="rgba(8, 51, 68, 0.55)" stroke="#22d3ee" stroke-width="1.5"/><text x="691.0" y="526" font-size="11" fill="#22d3ee" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">PANEL</text><rect x="458" y="540" width="466" height="66" rx="6" fill="rgba(136, 19, 55, 0.55)" stroke="#fb7185" stroke-width="1.5"/><text x="691.0" y="564" font-size="11" fill="#fb7185" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">DEBUG process-log lanes (L10)</text><text x="691.0" y="584" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">registered only when DEBUG=on (D2)</text><rect x="100" y="662" width="840" height="44" rx="6" fill="rgba(8, 51, 68, 0.55)" stroke="#22d3ee" stroke-width="1.5"/><text x="520.0" y="686" font-size="11" fill="#22d3ee" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">STATUS BAR — priority-ordered, truncated items (L9)</text><rect x="1000" y="100" width="410" height="470" rx="12" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="8,4"/><rect x="1018" y="89" width="194.6" height="22" rx="3" fill="rgba(15,23,42,0.95)" stroke="#a78bfa" stroke-width="1"/><text x="1026" y="104" font-size="12" fill="#a78bfa" text-anchor="start" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">view placement lifecycle</text><rect x="1020" y="150" width="370" height="84" rx="6" fill="rgba(30, 41, 59, 0.65)" stroke="#94a3b8" stroke-width="1.5"/><text x="1205.0" y="174" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">extension manifest (L3)</text><text x="1205.0" y="194" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">container + slot HINT</text><text x="1205.0" y="210" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">applies on first run only</text><line x1="1205" y1="234" x2="1205" y2="288" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr-slate)"/><rect x="1020" y="292" width="370" height="96" rx="6" fill="rgba(76, 29, 149, 0.55)" stroke="#a78bfa" stroke-width="1.5"/><text x="1205.0" y="316" font-size="11" fill="#a78bfa" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">core layout tree (L6)</text><text x="1205.0" y="336" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">per-window · core storage (S1)</text><text x="1205.0" y="352" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">restored every start</text><text x="1205.0" y="368" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">extensions: no direct access</text><line x1="1205" y1="388" x2="1205" y2="442" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr-slate)"/><rect x="1020" y="446" width="370" height="84" rx="6" fill="rgba(6, 78, 59, 0.55)" stroke="#34d399" stroke-width="1.5"/><text x="1205.0" y="470" font-size="11" fill="#34d399" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">USER override (L4)</text><text x="1205.0" y="490" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">move · hide · resize · reorder</text><text x="1205.0" y="506" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">persists — beats the hint forever</text><path d="M 1390 470 C 1425 470 1425 330 1390 330" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arr-emerald)"/><rect x="1020" y="610" width="370" height="84" rx="6" fill="rgba(136, 19, 55, 0.55)" stroke="#fb7185" stroke-width="1.5"/><text x="1205.0" y="634" font-size="11" fill="#fb7185" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">reveal/focus (L5)</text><text x="1205.0" y="654" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">only on direct user action</text><text x="1205.0" y="670" font-size="9" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">via the injected API (X4)</text><rect x="384.4" y="780.0" width="671.2" height="20.0" rx="3" fill="rgba(15,23,42,0.92)" stroke="rgba(148,163,184,0.75)" stroke-width="1"/><text x="720" y="793.6" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">extensions are guests — no top-level regions (L1) · no focus stealing (L5) · chrome is core-rendered (L12)</text><rect x="375.1" y="812.0" width="689.8" height="20.0" rx="3" fill="rgba(15,23,42,0.92)" stroke="rgba(148,163,184,0.75)" stroke-width="1"/><text x="720" y="825.6" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">every region is an a11y landmark; cross-region keyboard traversal is core-owned (L11 → sdlc-electron S1 gate)</text></svg>