nt-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">url4.run(target, io=…)</text><text x="175.0" y="447" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">compile_expression(target)</text><text x="175" y="337" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">primary (API) port ▶</text><line x1="300" y1="430" x2="374" y2="430" stroke="#22d3ee" stroke-width="2" marker-end="url(#arr-cyan)"/><text x="776.0" y="322" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">driven ports ▶</text><rect x="690" y="340" width="172" height="20" rx="3" fill="rgba(2,6,23,0.7)" stroke="#22d3ee" stroke-width="1"/><text x="776.0" y="354" font-size="9" fill="#22d3ee" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">IOLayer.fetch()</text><rect x="690" y="382" width="172" height="20" rx="3" fill="rgba(2,6,23,0.7)" stroke="#22d3ee" stroke-width="1"/><text x="776.0" y="396" font-size="9" fill="#22d3ee" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">SupportsFetchEx</text><rect x="690" y="424" width="172" height="20" rx="3" fill="rgba(2,6,23,0.7)" stroke="#22d3ee" stroke-width="1"/><text x="776.0" y="438" font-size="9" fill="#22d3ee" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">SupportsHoldings</text><rect x="690" y="484" width="172" height="20" rx="3" fill="rgba(2,6,23,0.7)" stroke="#a78bfa" stroke-width="1"/><text x="776.0" y="498" font-size="9" fill="#a78bfa" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">process · processor</text><text x="776.0" y="528" font-si