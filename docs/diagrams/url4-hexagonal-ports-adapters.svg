<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 820" width="1320" height="820" font-family="JetBrains Mono, Menlo, monospace"><title>url4 — hexagonal core, ports &amp; adapters</title><defs><marker id="arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/></marker><marker id="arr-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/></marker><marker id="arr-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/></marker><marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/></marker><marker id="arr-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fb7185"/></marker><marker id="arr-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="1320" height="820" fill="#020617"/><text x="32" y="42" font-size="18" fill="#e2e8f0" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">url4 — hexagonal core, ports &amp; adapters</text><text x="32" y="64" font-size="10.5" fill="#94a3b8" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">framework-free core defines ports; adapters implement them; the core never imports an adapter (dependency inversion)</text><polygon points="470,260 670,260 770,430 670,600 470,600 370,430" fill="rgba(6,78,59,0.55)" stroke="#34d399" stroke-width="2"/><text x="570" y="318" font-size="15" fill="#34d399" text-anchor="middle" font-weight="bold" paint-order="stro