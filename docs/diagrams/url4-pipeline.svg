><rect x="820" y="150" width="340" height="300" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="8,4"/><rect x="836" y="139" width="195" height="22" rx="3" fill="rgba(15,23,42,0.95)" stroke="#94a3b8" stroke-width="1"/><text x="933.5" y="154" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">TWO COMPILE PATHS → GRAPH</text><rect x="840" y="184" width="300" height="78" rx="6" fill="rgba(6,78,59,0.55)" stroke="#34d399" stroke-width="1.5"/><text x="990.0" y="206" font-size="13" fill="#34d399" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">text path (lazy)</text><text x="990.0" y="225" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">_compile_text: groups defer to</text><text x="990.0" y="242" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">LazyExprNode · Map body per row</text><rect x="840" y="290" width="300" height="78" rx="6" fill="rgba(76,29,149,0.55)" stroke="#a78bfa" stroke-width="1.5"/><text x="990.0" y="312" font-size="13" fill="#a78bfa" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">AST path (eager)</text><text x="990.0" y="331" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">_lower_top_level: fully expanded</text><text x="990.0" y="348" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">from an already-built parse tree</text><text x="990.0" y="400" font-size="9.5" fill="#94a3b8" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(