<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="JetBrains Mono, Menlo, monospace"><title>url4 — parse → compile → execute pipeline</title><defs><marker id="arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/></marker><marker id="arr-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/></marker><marker id="arr-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/></marker><marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/></marker><marker id="arr-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fb7185"/></marker><marker id="arr-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="1200" height="900" fill="#020617"/><text x="32" y="42" font-size="18" fill="#e2e8f0" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">url4 — parse → compile → execute pipeline</text><text x="32" y="64" font-size="10.5" fill="#94a3b8" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">surface text → decode_envelope → AST → lowered DAG → dataflow result · one shared envelope decode, cycle-free by construction</text><rect x="420" y="108" width="380" height="84" rx="6" fill="rgba(8,51,68,0.55)" stroke="#22d3ee" stroke-width="1.5"/><text x="610.0" y="130" font-size="13" fill="#22d3ee" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">surface text</text><text x="610.0" y="149" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">(a=/x, /claude($a)!&#x27;sum&#x27;)!go</text><rect x="420" y="258" width="380" height="84" rx="6" fill="rgba(8,51,68,0.55)" stroke="#22d3ee" stroke-width="1.5"/><text x="610.0" y="280" font-size="13" fill="#22d3ee" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">envelope  ·  parser.decode_envelope</text><text x="610.0" y="299" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">{source_expr, intent, broadcast,</text><text x="610.0" y="316" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2"> params, iteration?}</text><rect x="420" y="408" width="380" height="84" rx="6" fill="rgba(76,29,149,0.55)" stroke="#a78bfa" stroke-width="1.5"/><text x="610.0" y="430" font-size="13" fill="#a78bfa" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">AST  ·  url4.nodes</text><text x="610.0" y="449" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">closed union of frozen dataclasses</text><text x="610.0" y="466" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">Expression / Iteration root</text><rect x="420" y="558" width="380" height="84" rx="6" fill="rgba(6,78,59,0.55)" stroke="#34d399" stroke-width="1.5"/><text x="610.0" y="580" font-size="13" fill="#34d399" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">Graph(sink)  ·  dag.compiler</text><text x="610.0" y="599" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">LoweringRegistry: AST→node</text><text x="610.0" y="616" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">open set of DagNode strategies</text><rect x="420" y="708" width="380" height="84" rx="6" fill="rgba(120,53,15,0.45)" stroke="#fbbf24" stroke-width="1.5"/><text x="610.0" y="730" font-size="13" fill="#fbbf24" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">result: str  ·  dag.executor</text><text x="610.0" y="749" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">asyncio TaskGroup · memoized by id</text><text x="610.0" y="766" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">pull-based from the sink</text><line x1="610.0" y1="192" x2="610.0" y2="258" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arr-cyan)"/><rect x="509.0" y="214.0" width="202.0" height="22" rx="3" fill="rgba(15,23,42,0.94)" stroke="rgba(148,163,184,0.75)" stroke-width="1"/><text x="610.0" y="229.0" font-size="9" fill="#22d3ee" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">split_intent · ;params · src*()</text><line x1="610.0" y1="342" x2="610.0" y2="408" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arr-violet)"/><rect x="503.0" y="364.0" width="214.0" height="22" rx="3" fill="rgba(15,23,42,0.94)" stroke="rgba(148,163,184,0.75)" stroke-width="1"/><text x="610.0" y="379.0" font-size="9" fill="#a78bfa" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">grammar.parse (recursive descent)</text><line x1="610.0" y1="492" x2="610.0" y2="558" stroke="#34d399" stroke-width="1.8" marker-end="url(#arr-emerald)"/><rect x="506.0" y="514.0" width="208.0" height="22" rx="3" fill="rgba(15,23,42,0.94)" stroke="rgba(148,163,184,0.75)" stroke-width="1"/><text x="610.0" y="529.0" font-size="9" fill="#34d399" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">registry.lower  /  _compile_text</text><line x1="610.0" y1="642" x2="610.0" y2="708" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arr-amber)"/><rect x="536.0" y="664.0" width="148.0" height="22" rx="3" fill="rgba(15,23,42,0.94)" stroke="rgba(148,163,184,0.75)" stroke-width="1"/><text x="610.0" y="679.0" font-size="9" fill="#fbbf24" text-anchor="middle" font-weight="normal" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">Executor.execute(sink)</text><rect x="40" y="150" width="330" height="300" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="8,4"/><rect x="56" y="139" width="139" height="22" rx="3" fill="rgba(15,23,42,0.95)" stroke="#94a3b8" stroke-width="1"/><text x="125.5" y="154" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">DESIGN INVARIANTS</text><text x="56" y="184" font-size="9.5" fill="#a78bfa" text-anchor="start" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">• expression-problem flip</text><text x="56" y="204" font-size="9.5" fill="#94a3b8" text-anchor="start" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">• closed AST + open operations;</text><text x="56" y="224" font-size="9.5" fill="#94a3b8" text-anchor="start" font-weight="bold" paint-order="stroke fill" stroke="rgba(2,6,23,0.75)" stroke-width="2">• open DAG nodes + one op (resolve)</text><text x="56" y="24