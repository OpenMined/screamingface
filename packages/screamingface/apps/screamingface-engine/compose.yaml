name: screamingface-engine-dev

services:
  aigateway:
    build:
      context: ../../../..
      dockerfile: apps/aigateway/Dockerfile
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        python -m tortoise -c aigateway.db.TORTOISE_CONFIG migrate
        exec aigateway
    environment:
      AIGW_HOST: 0.0.0.0
      AIGW_PORT: "9105"
      AIGATEWAY_AUTH_ENABLED: "0"
      AIGATEWAY_DATABASE_URL: sqlite:///tmp/aigateway.sqlite3
    init: true
    ports:
      - "127.0.0.1:${AIGATEWAY_HOST_PORT:-9105}:9105"
      # The engine shares this network namespace so auth-disabled Gateway calls
      # are genuinely loopback. Published ports therefore belong here too.
      - "127.0.0.1:${SCREAMINGFACE_ENGINE_HOST_PORT:-4404}:4404"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9105/healthz', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 12

  searxng:
    image: docker.io/searxng/searxng@sha256:b8ca38ba06eea544d7555e88321e212ddc0d5c3c7de055419cfb2e5c6bf30812
    environment:
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
    init: true
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget --spider -q http://127.0.0.1:8080/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 12

  screamingface-engine:
    build:
      context: ../../../..
      dockerfile: packages/screamingface/apps/screamingface-engine/Dockerfile
    environment:
      AIGATEWAY_TIMEOUT: "120"
      AIGATEWAY_URL: http://127.0.0.1:9105
      SCREAMINGFACE_ENGINE_MAX_INFLIGHT: "16"
      SCREAMINGFACE_ENGINE_MAX_REQUEST_TARGET_BYTES: "61440"
      SCREAMINGFACE_SEARXNG_URL: http://searxng:8080
      SCREAMINGFACE_ENGINE_TIMEOUT: "120"
      URL4_HOST: 0.0.0.0
      URL4_PORT: "4404"
    init: true
    depends_on:
      aigateway:
        condition: service_healthy
      searxng:
        condition: service_healthy
    # AI Gateway's auth-disabled mode deliberately accepts loopback only. Keep
    # the processes isolated in separate containers while sharing networking so
    # the engine cannot accidentally weaken that boundary for local development.
    network_mode: service:aigateway
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:4404/healthz', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 12
