name: screamingface-engine-dev

services:
  aigateway:
    build:
      context: ../../../..
      dockerfile: apps/aigateway/Dockerfile
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        python -m tortoise -c aigateway.db.TORTOISE_CONFIG migrate
        exec aigateway
    environment:
      AIGW_HOST: 0.0.0.0
      AIGW_PORT: "9105"
      AIGATEWAY_AUTH_ENABLED: "0"
      AIGATEWAY_DATABASE_URL: sqlite:///tmp/aigateway.sqlite3
    init: true
    ports:
      - "127.0.0.1:${AIGATEWAY_HOST_PORT:-9105}:9105"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9105/healthz', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 12

  screamingface-engine:
    build:
      context: ../../../..
      dockerfile: packages/screamingface/apps/screamingface-engine/Dockerfile
    environment:
      AIGATEWAY_TIMEOUT: "120"
      AIGATEWAY_URL: http://aigateway:9105
      SCREAMINGFACE_ENGINE_MAX_INFLIGHT: "16"
      SCREAMINGFACE_ENGINE_TIMEOUT: "120"
      URL4_HOST: 0.0.0.0
      URL4_PORT: "4404"
    init: true
    depends_on:
      aigateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SCREAMINGFACE_ENGINE_HOST_PORT:-4404}:4404"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:4404/healthz', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 12
