name: screamingface-engine-dev

services:
  aigateway:
    build:
      context: ../../../..
      dockerfile: apps/aigateway/Dockerfile
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        python -m tortoise -c aigateway.db.TORTOISE_CONFIG migrate
        exec aigateway
    environment:
      AIGW_HOST: 0.0.0.0
      AIGW_PORT: "9105"
      AIGATEWAY_AUTH_ENABLED: "0"
      AIGATEWAY_DATABASE_URL: sqlite:///home/app/aigateway.sqlite3
      AIGATEWAY_PUBLIC_URL: http://localhost:${SCREAMINGFACE_ENGINE_HOST_PORT:-4404}
      # INVARIANT: This plugin setting replaces its complete default list; retain the existing
      # routes while adding only the two HF/provider pins verified for the Tavily agent loop.
      AIGW_HUGGINGFACE_DEFAULT_MODELS: >-
        ["huggingface/openai/gpt-oss-120b:cerebras",
        "huggingface/Qwen/Qwen3-Coder-480B-A35B-Instruct:novita",
        "huggingface/deepseek-ai/DeepSeek-R1:novita",
        "huggingface/google/gemma-2-2b-it:featherless-ai",
        "huggingface/meta-llama/Llama-3.1-8B-Instruct:nscale",
        "huggingface/deepseek-ai/DeepSeek-V4-Pro:deepinfra",
        "huggingface/zai-org/GLM-5.2:deepinfra"]
    init: true
    volumes:
      # The image creates /home/app with uid 1000; mounting at that existing
      # directory preserves a writable volume without changing AI Gateway.
      - aigateway-data:/home/app
    ports:
      - "127.0.0.1:${AIGATEWAY_HOST_PORT:-9105}:9105"
      # The engine shares this network namespace so auth-disabled Gateway calls
      # are genuinely loopback. Published ports therefore belong here too.
      - "127.0.0.1:${SCREAMINGFACE_ENGINE_HOST_PORT:-4404}:4404"
      # Codex's registered OAuth client accepts only loopback ports 1455/1457.
      # This second host port reaches the same engine listener in the shared namespace.
      - "127.0.0.1:${CODEX_OAUTH_HOST_PORT:-1455}:4404"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9105/healthz', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 12

  screamingface-engine:
    build:
      context: ../../../..
      dockerfile: packages/screamingface/apps/screamingface-engine/Dockerfile
    environment:
      AIGATEWAY_TIMEOUT: "120"
      AIGATEWAY_URL: http://127.0.0.1:9105
      SCREAMINGFACE_ENGINE_MAX_INFLIGHT: "16"
      SCREAMINGFACE_ENGINE_MAX_REQUEST_TARGET_BYTES: "61440"
      SCREAMINGFACE_CODEX_OAUTH_REDIRECT_URI: http://localhost:${CODEX_OAUTH_HOST_PORT:-1455}/auth/callback
      SCREAMINGFACE_ENGINE_TIMEOUT: "900"
      SCREAMINGFACE_TAVILY_TIMEOUT: "75"
      URL4_HOST: 0.0.0.0
      URL4_PORT: "4404"
    init: true
    depends_on:
      aigateway:
        condition: service_healthy
    # AI Gateway's auth-disabled mode deliberately accepts loopback only. Keep
    # the processes isolated in separate containers while sharing networking so
    # the engine cannot accidentally weaken that boundary for local development.
    network_mode: service:aigateway
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:4404/healthz', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 12

volumes:
  aigateway-data:
