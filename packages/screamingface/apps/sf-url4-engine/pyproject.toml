[project]
name = "sf-url4-engine"
version = "0.1.0"
description = "Temporary ScreamingFace package-development URL4 engine profile"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.0",
    "screamingface",
    "url4[server]>=0.1.0",
]

[project.scripts]
sf-url4-engine = "sf_url4_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sf_url4_engine"]

[tool.uv.sources]
screamingface = { path = "../..", editable = true }
url4 = { path = "../../../url4", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C901", "PLR0911", "PLR0912", "PLR0915", "PLR1702"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
]

