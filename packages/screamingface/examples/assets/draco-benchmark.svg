<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="900" viewBox="0 0 1560 900" font-family="Menlo, 'SF Mono', Consolas, monospace">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#565664" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="1560" height="900" fill="#0d0d10"/>

  <!-- header -->
  <text x="48" y="52" font-size="13" letter-spacing="2.5" fill="#d4a24e">&#128561; SCREAMINGFACE &#183; DRACO &#8212; WHAT THE BENCHMARK MEASURES</text>
  <text x="46" y="96" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#f2f2f4">100 research tasks, graded criterion by criterion.</text>
  <text x="48" y="126" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9a9aa4">Deep-research tasks from Perplexity, each with an expert rubric of ~40 weighted criteria. A judge model only answers "did the report meet this criterion?" &#8212; it never invents a score.</text>

  <!-- ══ card 1 : the exam ══ -->
  <rect x="100" y="170" width="430" height="380" rx="8" fill="#131318" stroke="#2a2a31"/>
  <text x="128" y="208" font-size="16" font-weight="bold" letter-spacing="1.5" fill="#f0f0f2">THE EXAM</text>
  <text x="128" y="230" font-size="12" font-style="italic" fill="#8a8a92" font-family="Georgia, serif">"Research this. Miss nothing. Invent nothing."</text>
  <rect x="368" y="192" width="134" height="24" rx="4" fill="none" stroke="#2dd4bf"/>
  <text x="435" y="208" font-size="11" fill="#2dd4bf" text-anchor="middle">100 tasks</text>

  <rect x="140" y="258" width="350" height="42" rx="6" fill="#101820" stroke="#3a4654"/>
  <text x="315" y="284" font-size="12" fill="#dfe8ea" text-anchor="middle">"Compare GLP-1 drug trials since 2023&#8230;"</text>

  <text x="152" y="330" font-size="11" fill="#6a6a74">its expert rubric, ~40 weighted criteria:</text>
  <rect x="152" y="342" width="314" height="28" rx="4" fill="#0d1b24" stroke="#2dd4bf"/>
  <text x="166" y="360" font-size="11" fill="#4ade80">+5</text>
  <text x="192" y="360" font-size="11" fill="#dfe8ea">cites the primary trial data</text>
  <rect x="152" y="378" width="314" height="28" rx="4" fill="#0d1b24" stroke="#2dd4bf"/>
  <text x="166" y="396" font-size="11" fill="#4ade80">+3</text>
  <text x="192" y="396" font-size="11" fill="#dfe8ea">covers both drug classes</text>
  <rect x="152" y="414" width="314" height="28" rx="4" fill="#1c1014" stroke="#e06c8a"/>
  <text x="166" y="432" font-size="11" fill="#e06c8a">&#8722;3</text>
  <text x="192" y="432" font-size="11" fill="#dfe8ea">states an unsupported claim</text>

  <text x="128" y="486" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca"><tspan font-weight="700" fill="#e8e8ec">Weights can be negative</tspan> &#8212; a rubric rewards</text>
  <text x="128" y="506" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca">coverage and punishes fabrication.</text>

  <!-- ══ card 2 : one report, paid judge ══ -->
  <rect x="565" y="170" width="430" height="380" rx="8" fill="#131318" stroke="#2a2a31"/>
  <text x="593" y="208" font-size="16" font-weight="bold" letter-spacing="1.5" fill="#f0f0f2">ONE REPORT</text>
  <rect x="843" y="192" width="118" height="24" rx="4" fill="none" stroke="#d4a24e"/>
  <text x="902" y="208" font-size="11" fill="#d4a24e" text-anchor="middle">judge model</text>

  <rect x="705" y="240" width="150" height="32" rx="6" fill="#101820" stroke="#3a4654"/>
  <text x="780" y="261" font-size="12" fill="#dfe8ea" text-anchor="middle">task</text>
  <line x1="780" y1="272" x2="780" y2="300" stroke="#565664" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="705" y="304" width="150" height="32" rx="6" fill="#0d1b24" stroke="#2dd4bf"/>
  <text x="780" y="325" font-size="12" fill="#dfe8ea" text-anchor="middle">your Candidate</text>
  <line x1="780" y1="336" x2="780" y2="364" stroke="#565664" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="705" y="368" width="150" height="32" rx="6" fill="#101820" stroke="#3a4654"/>
  <text x="780" y="389" font-size="12" fill="#dfe8ea" text-anchor="middle">research report</text>
  <line x1="780" y1="400" x2="780" y2="428" stroke="#565664" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="672" y="432" width="216" height="32" rx="6" fill="#20180a" stroke="#d4a24e"/>
  <text x="780" y="453" font-size="12" fill="#ecd9b0" text-anchor="middle">rubric judge &#8212; per criterion</text>

  <text x="593" y="506" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca"><tspan font-weight="700" fill="#e8e8ec">The judge answers MET / UNMET</tspan> per</text>
  <text x="593" y="526" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca">criterion &#8212; the arithmetic stays in code.</text>

  <!-- ══ card 3 : the case score ══ -->
  <rect x="1030" y="170" width="430" height="380" rx="8" fill="#131318" stroke="#2a2a31"/>
  <text x="1058" y="208" font-size="16" font-weight="bold" letter-spacing="1.5" fill="#f0f0f2">THE CASE SCORE</text>
  <rect x="1306" y="192" width="134" height="24" rx="4" fill="none" stroke="#4ade80"/>
  <text x="1373" y="208" font-size="11" fill="#4ade80" text-anchor="middle">worked example</text>

  <text x="1058" y="252" font-size="12" fill="#9a9aa4">rubric: +5, +3, and a &#8722;3 penalty</text>
  <text x="1058" y="288" font-size="13" fill="#dfe8ea">met <tspan fill="#4ade80">+5</tspan> &#183; missed <tspan fill="#9a9aa4">+3</tspan> &#183; hit <tspan fill="#e06c8a">&#8722;3</tspan></text>

  <text x="1058" y="336" font-size="14" fill="#f0f0f2">case  =</text>
  <text x="1170" y="324" font-size="13" fill="#dfe8ea">5 &#8722; 3</text>
  <line x1="1160" y1="334" x2="1250" y2="334" stroke="#9a9aa4"/>
  <text x="1170" y="356" font-size="13" fill="#dfe8ea">5 + 3</text>
  <text x="1290" y="340" font-size="14" fill="#d4a24e" font-weight="bold">=  0.25</text>

  <text x="1058" y="404" font-size="12" fill="#9a9aa4">only positive weights count as "possible";</text>
  <text x="1058" y="422" font-size="12" fill="#9a9aa4">penalties only subtract. Clamped to 0&#8230;1.</text>

  <text x="1058" y="486" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca"><tspan font-weight="700" fill="#e8e8ec">Fractions are the norm</tspan> &#8212; a case lands</text>
  <text x="1058" y="506" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca">anywhere in 0&#8230;1, not on pass/fail.</text>

  <!-- ══ score card ══ -->
  <rect x="100" y="580" width="1360" height="240" rx="8" fill="#16130d" stroke="#d4a24e" stroke-width="1.5"/>
  <rect x="100" y="562" width="150" height="24" rx="4" fill="#d4a24e"/>
  <text x="175" y="578" font-size="11" font-weight="bold" fill="#16130d" text-anchor="middle">THE SCORE</text>

  <text x="140" y="632" font-size="18" fill="#f0f0f2">score  =</text>
  <text x="286" y="620" font-size="15" fill="#dfe8ea">sum of the 100 case scores</text>
  <line x1="286" y1="632" x2="640" y2="632" stroke="#9a9aa4"/>
  <text x="463" y="656" font-size="15" fill="#dfe8ea" text-anchor="middle">100</text>

  <text x="140" y="706" font-size="13" fill="#9a9aa4">worked example: cases averaging 0.399 &#8594; final score <tspan fill="#d4a24e" font-weight="bold">0.399</tspan> &#8212; the paper&#8217;s normalized_score, untouched</text>

  <!-- range bar -->
  <rect x="820" y="622" width="500" height="10" rx="5" fill="#131318" stroke="#2a2a31"/>
  <rect x="820" y="622" width="200" height="10" rx="5" fill="#0d2018" stroke="#4ade80"/>
  <text x="820" y="612" font-size="11" fill="#6a6a74">0</text>
  <text x="1320" y="612" font-size="11" fill="#6a6a74" text-anchor="end">1</text>
  <circle cx="1020" cy="627" r="6" fill="#d4a24e"/>
  <text x="1020" y="656" font-size="11" fill="#d4a24e" text-anchor="middle">0.399</text>
  <text x="1340" y="631" font-size="11" fill="#9a9aa4">score range 0&#8230;1</text>

  <text x="140" y="768" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca"><tspan font-weight="700" fill="#e8e8ec">Mean of weighted rubric scores</tspan> &#8212; fractional by construction (0.399, not 40%). Higher is better.</text>

  <!-- footer -->
  <text x="48" y="878" font-size="11" letter-spacing="1.5" fill="#6a6a74">EXPERT RUBRICS &#183; NEGATIVE WEIGHTS &#183; PAID JUDGE GRADING</text>
  <text x="1512" y="878" font-size="11" letter-spacing="1.5" fill="#6a6a74" text-anchor="end">DRACO: PERPLEXITY, ARXIV 2602.11685</text>
</svg>
