<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="900" viewBox="0 0 1560 900" font-family="Menlo, 'SF Mono', Consolas, monospace">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#565664" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="1560" height="900" fill="#0d0d10"/>

  <!-- header -->
  <text x="48" y="52" font-size="13" letter-spacing="2.5" fill="#d4a24e">&#128561; SCREAMINGFACE &#183; HEALTHBENCH WORST-30% &#8212; WHAT THE BENCHMARK MEASURES</text>
  <text x="46" y="96" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#f2f2f4">The 157 hardest health conversations &#8212; negative scores are normal.</text>
  <text x="48" y="126" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9a9aa4">The 30% of HealthBench Professional that top models fail worst. Physician-written rubrics award points for good clinical answers &#8212; and subtract them for unsafe ones, with no floor.</text>

  <!-- ══ card 1 : the exam ══ -->
  <rect x="100" y="170" width="430" height="380" rx="8" fill="#131318" stroke="#2a2a31"/>
  <text x="128" y="208" font-size="16" font-weight="bold" letter-spacing="1.5" fill="#f0f0f2">THE EXAM</text>
  <text x="128" y="230" font-size="12" font-style="italic" fill="#8a8a92" font-family="Georgia, serif">"Answer like a careful clinician would."</text>
  <rect x="352" y="192" width="150" height="24" rx="4" fill="none" stroke="#2dd4bf"/>
  <text x="427" y="208" font-size="11" fill="#2dd4bf" text-anchor="middle">157 hardest</text>

  <rect x="140" y="258" width="350" height="42" rx="6" fill="#101820" stroke="#3a4654"/>
  <text x="315" y="284" font-size="12" fill="#dfe8ea" text-anchor="middle">"My father takes warfarin and now&#8230;"</text>

  <text x="152" y="330" font-size="11" fill="#6a6a74">its physician-written rubric:</text>
  <rect x="152" y="342" width="314" height="28" rx="4" fill="#0d1b24" stroke="#2dd4bf"/>
  <text x="166" y="360" font-size="11" fill="#4ade80">+5</text>
  <text x="192" y="360" font-size="11" fill="#dfe8ea">urges talking to the doctor</text>
  <rect x="152" y="378" width="314" height="28" rx="4" fill="#0d1b24" stroke="#2dd4bf"/>
  <text x="166" y="396" font-size="11" fill="#4ade80">+3</text>
  <text x="192" y="396" font-size="11" fill="#dfe8ea">names the interaction risk</text>
  <rect x="152" y="414" width="314" height="28" rx="4" fill="#1c1014" stroke="#e06c8a"/>
  <text x="166" y="432" font-size="11" fill="#e06c8a">&#8722;3</text>
  <text x="192" y="432" font-size="11" fill="#dfe8ea">invents a dosage</text>

  <text x="128" y="486" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca"><tspan font-weight="700" fill="#e8e8ec">Safety mistakes cost points</tspan> &#8212; a confident</text>
  <text x="128" y="506" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca">wrong answer scores worse than silence.</text>

  <!-- ══ card 2 : one answer, paid judge ══ -->
  <rect x="565" y="170" width="430" height="380" rx="8" fill="#131318" stroke="#2a2a31"/>
  <text x="593" y="208" font-size="16" font-weight="bold" letter-spacing="1.5" fill="#f0f0f2">ONE ANSWER</text>
  <rect x="843" y="192" width="118" height="24" rx="4" fill="none" stroke="#d4a24e"/>
  <text x="902" y="208" font-size="11" fill="#d4a24e" text-anchor="middle">judge model</text>

  <rect x="705" y="240" width="150" height="32" rx="6" fill="#101820" stroke="#3a4654"/>
  <text x="780" y="261" font-size="12" fill="#dfe8ea" text-anchor="middle">conversation</text>
  <line x1="780" y1="272" x2="780" y2="300" stroke="#565664" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="705" y="304" width="150" height="32" rx="6" fill="#0d1b24" stroke="#2dd4bf"/>
  <text x="780" y="325" font-size="12" fill="#dfe8ea" text-anchor="middle">your Candidate</text>
  <line x1="780" y1="336" x2="780" y2="364" stroke="#565664" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="705" y="368" width="150" height="32" rx="6" fill="#101820" stroke="#3a4654"/>
  <text x="780" y="389" font-size="12" fill="#dfe8ea" text-anchor="middle">final reply</text>
  <line x1="780" y1="400" x2="780" y2="428" stroke="#565664" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="660" y="432" width="240" height="32" rx="6" fill="#20180a" stroke="#d4a24e"/>
  <text x="780" y="453" font-size="12" fill="#ecd9b0" text-anchor="middle">physician rubric &#8212; per criterion</text>

  <text x="593" y="506" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca"><tspan font-weight="700" fill="#e8e8ec">The judge marks each criterion hit or missed</tspan></text>
  <text x="593" y="526" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca">&#8212; the point arithmetic stays in code.</text>

  <!-- ══ card 3 : the case score ══ -->
  <rect x="1030" y="170" width="430" height="380" rx="8" fill="#131318" stroke="#2a2a31"/>
  <text x="1058" y="208" font-size="16" font-weight="bold" letter-spacing="1.5" fill="#f0f0f2">THE CASE SCORE</text>
  <rect x="1322" y="192" width="118" height="24" rx="4" fill="none" stroke="#e06c8a"/>
  <text x="1381" y="208" font-size="11" fill="#e06c8a" text-anchor="middle">no floor</text>

  <text x="1058" y="248" font-size="12" fill="#9a9aa4">points +5, +3, penalty &#8722;3:</text>
  <text x="1058" y="282" font-size="13" fill="#dfe8ea">hit <tspan fill="#4ade80">+5</tspan> &#183; missed <tspan fill="#9a9aa4">+3</tspan> &#183; hit <tspan fill="#e06c8a">&#8722;3</tspan></text>

  <text x="1058" y="326" font-size="14" fill="#f0f0f2">case  =</text>
  <text x="1168" y="314" font-size="13" fill="#dfe8ea">5 &#8722; 3</text>
  <line x1="1160" y1="324" x2="1250" y2="324" stroke="#9a9aa4"/>
  <text x="1172" y="346" font-size="13" fill="#dfe8ea">5 + 3</text>
  <text x="1290" y="330" font-size="14" fill="#d4a24e" font-weight="bold">=  0.25</text>

  <text x="1058" y="392" font-size="12" fill="#9a9aa4">hit mostly penalties instead?</text>
  <text x="1058" y="424" font-size="14" fill="#e06c8a">earned &#8722;3 of 8 possible  =  <tspan font-weight="bold">&#8722;0.375</tspan></text>

  <text x="1058" y="486" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca"><tspan font-weight="700" fill="#e8e8ec">Below zero is a real result</tspan> &#8212; the case</text>
  <text x="1058" y="506" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca">score is never clamped.</text>

  <!-- ══ score card ══ -->
  <rect x="100" y="580" width="1360" height="240" rx="8" fill="#16130d" stroke="#d4a24e" stroke-width="1.5"/>
  <rect x="100" y="562" width="150" height="24" rx="4" fill="#d4a24e"/>
  <text x="175" y="578" font-size="11" font-weight="bold" fill="#16130d" text-anchor="middle">THE SCORE</text>

  <text x="140" y="632" font-size="18" fill="#f0f0f2">score  =</text>
  <text x="286" y="620" font-size="15" fill="#dfe8ea">sum of the 157 case scores</text>
  <line x1="286" y1="632" x2="640" y2="632" stroke="#9a9aa4"/>
  <text x="463" y="656" font-size="15" fill="#dfe8ea" text-anchor="middle">157</text>
  <text x="672" y="638" font-size="13" fill="#e06c8a">&#8212; negatives kept</text>

  <text x="140" y="706" font-size="13" fill="#9a9aa4">every serious baseline lands below zero here &#8212; e.g. <tspan fill="#e06c8a" font-weight="bold">&#8722;1.14</tspan>. Less negative = better.</text>

  <!-- range bar with negative zone -->
  <rect x="820" y="622" width="500" height="10" rx="5" fill="#131318" stroke="#2a2a31"/>
  <rect x="820" y="622" width="333" height="10" rx="5" fill="#1c1014" stroke="#e06c8a"/>
  <text x="820" y="612" font-size="11" fill="#e06c8a">&#8722;2</text>
  <text x="1153" y="612" font-size="11" fill="#6a6a74" text-anchor="middle">0</text>
  <text x="1320" y="612" font-size="11" fill="#6a6a74" text-anchor="end">1</text>
  <circle cx="963" cy="627" r="6" fill="#e06c8a"/>
  <text x="963" y="656" font-size="11" fill="#e06c8a" text-anchor="middle">&#8722;1.14</text>
  <text x="1340" y="631" font-size="11" fill="#9a9aa4">unclipped &#8212; no 0-floor</text>

  <text x="140" y="768" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca"><tspan font-weight="700" fill="#e8e8ec">The official score floors this mean at 0</tspan> &#8212; which would flatten the whole hard subset to 0.00. The challenge keeps the raw mean, so progress stays visible.</text>

  <!-- footer -->
  <text x="48" y="878" font-size="11" letter-spacing="1.5" fill="#6a6a74">PHYSICIAN RUBRICS &#183; PENALTIES SUBTRACT &#183; NEGATIVE IS NORMAL &#183; HIGHER IS BETTER</text>
  <text x="1512" y="878" font-size="11" letter-spacing="1.5" fill="#6a6a74" text-anchor="end">HEALTHBENCH: OPENAI SIMPLE-EVALS</text>
</svg>
