<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="900" viewBox="0 0 1560 900" font-family="Menlo, 'SF Mono', Consolas, monospace">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#565664" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="1560" height="900" fill="#0d0d10"/>

  <!-- header -->
  <text x="48" y="52" font-size="13" letter-spacing="2.5" fill="#d4a24e">&#128561; SCREAMINGFACE &#183; IFEVAL &#8212; WHAT THE BENCHMARK MEASURES</text>
  <text x="46" y="96" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#f2f2f4">541 instructions, zero judges &#8212; a machine checks every rule.</text>
  <text x="48" y="126" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9a9aa4">Each prompt bundles machine-verifiable constraints. Your Candidate answers once per prompt; a deterministic verifier checks every constraint &#8212; no judge model, no cost, no opinion.</text>

  <!-- ══ card 1 : the exam ══ -->
  <rect x="100" y="170" width="430" height="380" rx="8" fill="#131318" stroke="#2a2a31"/>
  <text x="128" y="208" font-size="16" font-weight="bold" letter-spacing="1.5" fill="#f0f0f2">THE EXAM</text>
  <text x="128" y="230" font-size="12" font-style="italic" fill="#8a8a92" font-family="Georgia, serif">"Follow the instructions. All of them."</text>
  <rect x="352" y="192" width="150" height="24" rx="4" fill="none" stroke="#2dd4bf"/>
  <text x="427" y="208" font-size="11" fill="#2dd4bf" text-anchor="middle">541 prompts</text>

  <rect x="140" y="258" width="350" height="42" rx="6" fill="#101820" stroke="#3a4654"/>
  <text x="315" y="284" font-size="12" fill="#dfe8ea" text-anchor="middle">"Write a cover letter&#8230;"</text>

  <text x="152" y="330" font-size="11" fill="#6a6a74">bundled constraints, each one checkable:</text>
  <rect x="152" y="342" width="150" height="28" rx="4" fill="#0d1b24" stroke="#2dd4bf"/>
  <text x="227" y="360" font-size="11" fill="#dfe8ea" text-anchor="middle">&#8805; 300 words</text>
  <rect x="316" y="342" width="150" height="28" rx="4" fill="#0d1b24" stroke="#2dd4bf"/>
  <text x="391" y="360" font-size="11" fill="#dfe8ea" text-anchor="middle">no commas</text>
  <rect x="152" y="378" width="150" height="28" rx="4" fill="#0d1b24" stroke="#2dd4bf"/>
  <text x="227" y="396" font-size="11" fill="#dfe8ea" text-anchor="middle">valid JSON</text>
  <rect x="316" y="378" width="150" height="28" rx="4" fill="#0d1b24" stroke="#2dd4bf"/>
  <text x="391" y="396" font-size="11" fill="#dfe8ea" text-anchor="middle">3 paragraphs</text>

  <text x="128" y="466" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca"><tspan font-weight="700" fill="#e8e8ec">Every rule is mechanical</tspan> &#8212; word counts,</text>
  <text x="128" y="486" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca">formats, keywords. Nothing is a matter of taste.</text>

  <!-- ══ card 2 : one attempt, free check ══ -->
  <rect x="565" y="170" width="430" height="380" rx="8" fill="#131318" stroke="#2a2a31"/>
  <text x="593" y="208" font-size="16" font-weight="bold" letter-spacing="1.5" fill="#f0f0f2">ONE ATTEMPT</text>
  <rect x="835" y="192" width="126" height="24" rx="4" fill="none" stroke="#4ade80"/>
  <text x="898" y="208" font-size="11" fill="#4ade80" text-anchor="middle">no judge</text>

  <rect x="705" y="240" width="150" height="32" rx="6" fill="#101820" stroke="#3a4654"/>
  <text x="780" y="261" font-size="12" fill="#dfe8ea" text-anchor="middle">prompt</text>
  <line x1="780" y1="272" x2="780" y2="300" stroke="#565664" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="705" y="304" width="150" height="32" rx="6" fill="#0d1b24" stroke="#2dd4bf"/>
  <text x="780" y="325" font-size="12" fill="#dfe8ea" text-anchor="middle">your Candidate</text>
  <line x1="780" y1="336" x2="780" y2="364" stroke="#565664" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="705" y="368" width="150" height="32" rx="6" fill="#101820" stroke="#3a4654"/>
  <text x="780" y="389" font-size="12" fill="#dfe8ea" text-anchor="middle">answer</text>
  <line x1="780" y1="400" x2="780" y2="428" stroke="#565664" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="672" y="432" width="216" height="32" rx="6" fill="#0d2018" stroke="#4ade80"/>
  <text x="780" y="453" font-size="12" fill="#dfe8ea" text-anchor="middle">deterministic verifier</text>

  <text x="593" y="506" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca"><tspan font-weight="700" fill="#e8e8ec">One invocation per prompt</tspan> &#8212; then code, not</text>
  <text x="593" y="526" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca">a model, re-checks every constraint. Grading is free.</text>

  <!-- ══ card 3 : the case grade ══ -->
  <rect x="1030" y="170" width="430" height="380" rx="8" fill="#131318" stroke="#2a2a31"/>
  <text x="1058" y="208" font-size="16" font-weight="bold" letter-spacing="1.5" fill="#f0f0f2">THE CASE GRADE</text>
  <rect x="1290" y="192" width="150" height="24" rx="4" fill="none" stroke="#d4a24e"/>
  <text x="1365" y="208" font-size="11" fill="#d4a24e" text-anchor="middle">all-or-nothing</text>

  <text x="1058" y="256" font-size="12" fill="#9a9aa4">every constraint followed (strict):</text>
  <text x="1082" y="292" font-size="16" fill="#4ade80">&#10003; &#10003; &#10003; &#10003;</text>
  <text x="1420" y="292" font-size="16" font-weight="bold" fill="#4ade80" text-anchor="end">&#8594;  1</text>

  <text x="1058" y="340" font-size="12" fill="#9a9aa4">one constraint missed:</text>
  <text x="1082" y="376" font-size="16" fill="#e06c8a">&#10003; &#10007; &#10003; &#10003;</text>
  <text x="1420" y="376" font-size="16" font-weight="bold" fill="#e06c8a" text-anchor="end">&#8594;  0</text>

  <line x1="1058" y1="404" x2="1432" y2="404" stroke="#2a2a31"/>
  <text x="1058" y="436" font-size="12" fill="#9a9aa4">a looser pass (formatting slack) is</text>
  <text x="1058" y="454" font-size="12" fill="#9a9aa4">tracked as a metric &#8212; it never scores.</text>

  <text x="1058" y="506" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca"><tspan font-weight="700" fill="#e8e8ec">Partial credit does not exist</tspan> &#8212; a prompt</text>
  <text x="1058" y="526" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca">counts only when every rule holds at once.</text>

  <!-- ══ score card ══ -->
  <rect x="100" y="580" width="1360" height="240" rx="8" fill="#16130d" stroke="#d4a24e" stroke-width="1.5"/>
  <rect x="100" y="562" width="150" height="24" rx="4" fill="#d4a24e"/>
  <text x="175" y="578" font-size="11" font-weight="bold" fill="#16130d" text-anchor="middle">THE SCORE</text>

  <text x="140" y="632" font-size="18" fill="#f0f0f2">score  =</text>
  <text x="286" y="620" font-size="15" fill="#dfe8ea">prompts with every strict rule followed</text>
  <line x1="286" y1="632" x2="700" y2="632" stroke="#9a9aa4"/>
  <text x="493" y="656" font-size="15" fill="#dfe8ea" text-anchor="middle">541</text>

  <text x="140" y="706" font-size="13" fill="#9a9aa4">worked example: follows all rules on 271 of 541 prompts &#8594; 271 / 541 = <tspan fill="#d4a24e" font-weight="bold">0.501</tspan></text>

  <!-- range bar -->
  <rect x="820" y="622" width="500" height="10" rx="5" fill="#131318" stroke="#2a2a31"/>
  <rect x="820" y="622" width="250" height="10" rx="5" fill="#0d2018" stroke="#4ade80"/>
  <text x="820" y="612" font-size="11" fill="#6a6a74">0</text>
  <text x="1320" y="612" font-size="11" fill="#6a6a74" text-anchor="end">1</text>
  <circle cx="1070" cy="627" r="6" fill="#d4a24e"/>
  <text x="1070" y="656" font-size="11" fill="#d4a24e" text-anchor="middle">0.501</text>
  <text x="1340" y="631" font-size="11" fill="#9a9aa4">score range 0&#8230;1</text>

  <text x="140" y="768" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca"><tspan font-weight="700" fill="#e8e8ec">Prompt-level strict accuracy</tspan> &#8212; the paper&#8217;s headline number, reproduced exactly. Higher is better.</text>

  <!-- footer -->
  <text x="48" y="878" font-size="11" letter-spacing="1.5" fill="#6a6a74">OFFICIAL 541 PROMPTS &#183; ONE INVOCATION PER CASE &#183; FREE DETERMINISTIC GRADING</text>
  <text x="1512" y="878" font-size="11" letter-spacing="1.5" fill="#6a6a74" text-anchor="end">IFEVAL: ZHOU ET AL., ARXIV 2311.07911</text>
</svg>
