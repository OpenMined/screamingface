[project]
name = "screamingface"
version = "0.1.0"
description = "Evaluate Models and Fusions on URL4-native research benchmarks"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["ai", "llm", "evaluation", "benchmarks", "url4"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pynacl>=1.5",
    "pyyaml>=6.0",
    "url4>=1.3.0",
    "websockets>=16.1,<17",
]

[project.urls]
Homepage = "https://screamingface.ai"
Repository = "https://github.com/OpenMined/screamingface"
Issues = "https://github.com/OpenMined/screamingface/issues"

[project.optional-dependencies]
notebook = [
    "ipywidgets>=8.1",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screamingface"]

[tool.uv.sources]
url4 = { path = "../url4", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C901", "PLR0911", "PLR0912", "PLR0915", "PLR1702"]
preview = true
explicit-preview-rules = true

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-statements = 26
max-branches = 7
max-returns = 3

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:screamingface",
]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]
