[project]
name = "url4"
version = "0.2.0"
description = "Standalone core library for the url4 expression protocol — grammar, parser, AST, interpreter, and scope"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# Url4Node.serve() — the ASGI app itself is framework-free; only serving needs this.
server = ["uvicorn>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/url4"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C901", "PLR0911", "PLR0912", "PLR0915", "PLR1702"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-statements = 26
max-branches = 7
max-returns = 3

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:url4",
]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
]

# Notebook-only aids for examples/ (not needed by the library itself).
# `graphviz` also needs the system Graphviz binary: `apt install graphviz` /
# `brew install graphviz`.
notebook = [
    "graphviz>=0.20",
]
